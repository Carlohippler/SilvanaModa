<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <!-- Fundo: preto profundo -->
    <linearGradient id="bg" x1="0" y1="0" x2="1200" y2="630" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#0a0a0b"/>
      <stop offset="100%" stop-color="#13101280"/>
    </linearGradient>

    <!-- Brilho dourado central -->
    <radialGradient id="glow" cx="50%" cy="44%" r="52%" fx="50%" fy="44%">
      <stop offset="0%"  stop-color="#c9a24b" stop-opacity="0.13"/>
      <stop offset="100%" stop-color="#c9a24b" stop-opacity="0"/>
    </radialGradient>

    <!-- Gradiente dourado para textos/linhas -->
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%"  stop-color="#e7cf8f"/>
      <stop offset="50%" stop-color="#c9a24b"/>
      <stop offset="100%" stop-color="#8a713a"/>
    </linearGradient>

    <!-- Gradiente dourado vertical (monograma) -->
    <linearGradient id="goldV" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%"  stop-color="#e7cf8f"/>
      <stop offset="100%" stop-color="#c9a24b"/>
    </linearGradient>

    <!-- Filtro de blur suave para brilho -->
    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="18" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>

    <!-- Clip do canvas -->
    <clipPath id="canvas">
      <rect width="1200" height="630"/>
    </clipPath>
  </defs>

  <g clip-path="url(#canvas)">

    <!-- === Fundo === -->
    <rect width="1200" height="630" fill="url(#bg)"/>
    <rect width="1200" height="630" fill="url(#glow)"/>

    <!-- Grade decorativa muito sutil (linhas) -->
    <g stroke="#c9a24b" stroke-opacity="0.04" stroke-width="1">
      <line x1="0" y1="105" x2="1200" y2="105"/>
      <line x1="0" y1="210" x2="1200" y2="210"/>
      <line x1="0" y1="315" x2="1200" y2="315"/>
      <line x1="0" y1="420" x2="1200" y2="420"/>
      <line x1="0" y1="525" x2="1200" y2="525"/>
      <line x1="200" y1="0" x2="200" y2="630"/>
      <line x1="400" y1="0" x2="400" y2="630"/>
      <line x1="600" y1="0" x2="600" y2="630"/>
      <line x1="800" y1="0" x2="800" y2="630"/>
      <line x1="1000" y1="0" x2="1000" y2="630"/>
    </g>

    <!-- Ornamento circular de fundo (grande, sutil) -->
    <circle cx="600" cy="315" r="280" fill="none" stroke="#c9a24b" stroke-width="1" stroke-opacity="0.07"/>
    <circle cx="600" cy="315" r="220" fill="none" stroke="#c9a24b" stroke-width="0.5" stroke-opacity="0.05"/>

    <!-- Brilho pontual superior -->
    <ellipse cx="600" cy="100" rx="300" ry="80" fill="#c9a24b" opacity="0.07" filter="url(#softGlow)"/>

    <!-- Linha dourada superior -->
    <rect x="0" y="0" width="1200" height="2" fill="url(#gold)" opacity="0.8"/>

    <!-- Linha dourada inferior -->
    <rect x="0" y="628" width="1200" height="2" fill="url(#gold)" opacity="0.8"/>

    <!-- === Monograma "S" (círculo ornamentado) === -->
    <circle cx="600" cy="218" r="56" fill="#13101280" stroke="#c9a24b" stroke-width="1.5" stroke-opacity="0.6"/>
    <circle cx="600" cy="218" r="62" fill="none" stroke="#c9a24b" stroke-width="0.5" stroke-opacity="0.25"/>
    <!-- Letra S -->
    <text x="600" y="238"
          font-family="Georgia, 'Times New Roman', serif"
          font-size="62"
          font-style="italic"
          fill="url(#goldV)"
          text-anchor="middle"
          letter-spacing="0">S</text>

    <!-- Traço ornamental esquerdo do círculo -->
    <line x1="430" y1="218" x2="530" y2="218" stroke="#c9a24b" stroke-width="0.8" stroke-opacity="0.35"/>
    <!-- Traço ornamental direito -->
    <line x1="670" y1="218" x2="770" y2="218" stroke="#c9a24b" stroke-width="0.8" stroke-opacity="0.35"/>
    <!-- Losango esquerdo -->
    <polygon points="424,218 430,212 436,218 430,224" fill="#c9a24b" opacity="0.35"/>
    <!-- Losango direito -->
    <polygon points="764,218 770,212 776,218 770,224" fill="#c9a24b" opacity="0.35"/>

    <!-- === Nome da loja === -->
    <text x="600" y="335"
          font-family="Georgia, 'Times New Roman', serif"
          font-size="64"
          font-weight="400"
          letter-spacing="4"
          fill="url(#gold)"
          text-anchor="middle">Silvana</text>

    <!-- Subtítulo -->
    <text x="600" y="382"
          font-family="'Trebuchet MS', Arial, sans-serif"
          font-size="20"
          font-weight="400"
          letter-spacing="10"
          fill="#a89f8e"
          text-anchor="middle">MODA &amp; COSMÉTICOS</text>

    <!-- Linha separadora central -->
    <rect x="480" y="405" width="240" height="1" fill="url(#gold)" opacity="0.4"/>

    <!-- Tagline -->
    <text x="600" y="440"
          font-family="Georgia, 'Times New Roman', serif"
          font-size="18"
          font-style="italic"
          fill="#8a713a"
          text-anchor="middle"
          letter-spacing="1">Moda com brilho e atitude</text>

    <!-- === Ornamentos de canto === -->
    <!-- Canto superior esquerdo -->
    <g opacity="0.25" stroke="#c9a24b" fill="none" stroke-width="1">
      <line x1="48" y1="48" x2="90" y2="48"/>
      <line x1="48" y1="48" x2="48" y2="90"/>
    </g>
    <!-- Canto superior direito -->
    <g opacity="0.25" stroke="#c9a24b" fill="none" stroke-width="1">
      <line x1="1152" y1="48" x2="1110" y2="48"/>
      <line x1="1152" y1="48" x2="1152" y2="90"/>
    </g>
    <!-- Canto inferior esquerdo -->
    <g opacity="0.25" stroke="#c9a24b" fill="none" stroke-width="1">
      <line x1="48" y1="582" x2="90" y2="582"/>
      <line x1="48" y1="582" x2="48" y2="540"/>
    </g>
    <!-- Canto inferior direito -->
    <g opacity="0.25" stroke="#c9a24b" fill="none" stroke-width="1">
      <line x1="1152" y1="582" x2="1110" y2="582"/>
      <line x1="1152" y1="582" x2="1152" y2="540"/>
    </g>

    <!-- Losanges de canto (detalhe fino) -->
    <polygon points="600,68 607,75 600,82 593,75" fill="#c9a24b" opacity="0.3"/>
    <polygon points="600,548 607,555 600,562 593,555" fill="#c9a24b" opacity="0.3"/>
  </g>
</svg>
