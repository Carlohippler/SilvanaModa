/* Paleta de fundo por categoria para a mídia do produto — como ainda não
   há fotos, cada categoria recebe uma tonalidade sutil própria e um
   monograma com a inicial do nome, em vez de um ícone genérico repetido
   em todos os cartões. */
const CATEGORY_TINT = {
  'Vestidos':   '#241b1d, #0d0c0d',
  'Blusas':     '#1d2024, #0d0c0d',
  'Calças':     '#1a1d17, #0d0c0d',
  'Saias':      '#241f14, #0d0c0d',
  'Conjuntos':  '#231a24, #0d0c0d',
  'Acessórios': '#1f1b14, #0d0c0d',
  'Calçados':   '#141c20, #0d0c0d',
  'Perfumaria': '#201620, #0d0c0d',
  'Cosméticos': '#231619, #0d0c0d'
};
/* Mesma ideia, em tons claros — usada quando o tema claro está ativo,
   para o placeholder não ficar escuro destoando do resto da loja clara. */
const CATEGORY_TINT_LIGHT = {
  'Vestidos':   '#ecdfe0, #ddcaca',
  'Blusas':     '#dde2e6, #ccd3d8',
  'Calças':     '#dee2d6, #ccd2c0',
  'Saias':      '#ece4d0, #ddd0ac',
  'Conjuntos':  '#e8dde8, #d8c8d8',
  'Acessórios': '#e6e0d0, #d6c9a8',
  'Calçados':   '#d9e4e6, #c3d6d8',
  'Perfumaria': '#e8dde6, #d6c5d4',
  'Cosméticos': '#ecdcdd, #ddc5c8'
};
/* Retorna o array de fotos do produto, normalizando fotoUrl legado.
   O .filter(Boolean) remove strings vazias/nulas que porventura tenham
   ficado salvas no array — sem isso, um <img src=""> aparece como
   ícone de imagem quebrada em vez de cair no placeholder. */
function productFotos(p){
  const fotos = (p.fotos && p.fotos.length) ? p.fotos : (p.fotoUrl ? [p.fotoUrl] : []);
  return fotos.filter(Boolean);
}
/* Estilo do fundo quando o produto NÃO tem foto (placeholder por categoria).
   A foto em si (quando existe) é renderizada com uma tag <img> real nos
   locais que a usam, em vez de background-image via CSS: isso evita um
   problema observado onde a imagem carrega normalmente numa <img> mas não
   aparece quando aplicada só como background-image inline. */
function productMediaStyle(p){
  const isLight = document.documentElement.getAttribute('data-theme')==='light';
  const tints = isLight ? CATEGORY_TINT_LIGHT : CATEGORY_TINT;
  const fallback = isLight ? '#ddd6c8, #c8bfb0' : '#1c191b, #0d0c0d';
  const tint = tints[p.categoria] || fallback;
  return `--p-media:linear-gradient(165deg, ${tint});`;
}
/* Tag <img> da capa do produto, com fallback automático pro placeholder
   (glyph) se a imagem falhar ao carregar — assim nunca fica um ícone
   de imagem quebrada visível pro cliente. */
function productCoverImgHtml(p, fotos){
  if(!fotos.length) return '';
  return `<img class="p-card-img" src="${escapeHtml(fotos[0])}" alt="${escapeHtml(p.nome)}" loading="lazy" onerror="this.remove();">`;
}
function productGlyph(nome){
  return escapeHtml((nome||'?').trim().charAt(0).toUpperCase());
}

function renderProductCard(p){
  const soldOut = p.estoque < 1;
  const lowStock = !soldOut && p.estoque <= (state.settings.lowStockThreshold||3);
  const needsSize = p.sizes && p.sizes.length && !(p.sizes.length===1 && p.sizes[0]==='Único');
  const selectedSize = state.ui.cartSizeSel[p.id] || (p.sizes && p.sizes.length===1 ? p.sizes[0] : '');
  const fotos = productFotos(p);
  const isFav = state.favorites.has(p.id);
  return `
    <div class="p-card ${soldOut?'sold-out':''}">
      <div class="p-card-media" style="${productMediaStyle(p)} cursor:pointer;" data-open-product="${p.id}" role="button" tabindex="0" aria-label="Ver detalhes de ${escapeHtml(p.nome)}">
        <span class="glyph">${productGlyph(p.nome)}</span>
        ${productCoverImgHtml(p, fotos)}
        ${soldOut?`<span class="p-card-tag out">Esgotado</span>`:(lowStock?`<span class="p-card-tag">Últimas peças</span>`:'')}
        <button class="p-fav-btn ${isFav?'fav':''}" data-fav="${p.id}" aria-label="${isFav?'Remover dos favoritos':'Adicionar aos favoritos'}" title="${isFav?'Remover dos favoritos':'Adicionar aos favoritos'}">${isFav?ICON.heartFill:ICON.heart}</button>
      </div>
      <div class="p-card-body">
        <span class="p-card-cat">${escapeHtml(p.categoria)}</span>
        <div class="p-card-name" data-open-product="${p.id}" style="cursor:pointer;">${escapeHtml(p.nome)}</div>
        ${needsSize ? `<div class="p-card-sizes">
          ${p.sizes.map(s=>`<div class="p-size-opt ${selectedSize===s?'sel':''}" data-size-choice="${p.id}|${s}">${escapeHtml(s)}</div>`).join('')}
        </div>` : ''}
        <div class="p-card-price" data-open-product="${p.id}" style="cursor:pointer;">${money(p.preco)}</div>
        <button class="p-card-add" data-add-cart="${p.id}" ${soldOut?'disabled':''}>
          ${soldOut?'Esgotado':`${ICON.bag} Adicionar`}
        </button>
      </div>
    </div>`;
}

async function resolveCustomerSession(){
  if(!sb) return;
  // A administradora já está resolvida (adminSession); não mexe em
  // state.currentCustomer nesse caso — applyAuthSession garante que
  // os dois nunca ficam preenchidos ao mesmo tempo.
  if(isAdminLoggedIn()) return;
  state.currentCustomer = null;
  try{
    const { data } = await sb.auth.getSession();
    if(data && data.session) await applyAuthSession(data.session);
  }catch(e){ console.warn('[Auth] falha ao obter sessão de cliente.', e.message||e); }
  await loadFavorites();
}

function renderStore(){
  const { lojaBusca, lojaCategoria, lojaOrdenacao, lojaSoFavoritos } = state.ui;
  let list = state.products.slice();
  if(lojaCategoria!=='todas') list = list.filter(p=>p.categoria===lojaCategoria);
  if(lojaBusca.trim()){
    const q = lojaBusca.trim().toLowerCase();
    list = list.filter(p=>p.nome.toLowerCase().includes(q));
  }
  if(lojaSoFavoritos){
    list = list.filter(p=>state.favorites.has(p.id));
  }

  // Unidades vendidas por produto, somadas a partir do histórico de vendas
  // já carregado em state.sales — usado só para a ordenação "Mais vendidos",
  // sem alterar nada da lógica de vendas em si.
  const vendidosPorProduto = {};
  if(Array.isArray(state.sales)){
    state.sales.forEach(venda=>{
      (venda.itens||[]).forEach(it=>{
        vendidosPorProduto[it.productId] = (vendidosPorProduto[it.productId]||0) + (it.qtd||0);
      });
    });
  }
  const indiceCadastro = new Map(state.products.map((p,i)=>[p.id,i]));

  list.sort((a,b)=>{
    const ea = a.estoque<1?1:0, eb = b.estoque<1?1:0;
    if(ea!==eb) return ea-eb; // esgotados sempre por último, qualquer que seja a ordenação
    if(lojaOrdenacao==='menor-preco') return a.preco-b.preco;
    if(lojaOrdenacao==='maior-preco') return b.preco-a.preco;
    if(lojaOrdenacao==='vendidos'){
      const diff = (vendidosPorProduto[b.id]||0) - (vendidosPorProduto[a.id]||0);
      return diff!==0 ? diff : a.nome.localeCompare(b.nome);
    }
    if(lojaOrdenacao==='novidades') return indiceCadastro.get(b.id) - indiceCadastro.get(a.id);
    return a.nome.localeCompare(b.nome);
  });

  const cartQty = state.cart.reduce((s,i)=>s+i.qtd,0);
  const storeName = state.settings.storeName || 'Silvana Moda & Cosméticos';
  const firstName = storeName.split(' ')[0];
  const totalCatalogo = state.products.length;

  function chipTab(val,label){
    return `<button class="store-chip ${lojaCategoria===val?'active':''}" data-loja-cat="${val}">${label}</button>`;
  }

  const favCount = state.favorites.size;
  /* Só exibe o contador numérico quando a cliente está logada e tem favoritos.
     Visitantes sem login vêem o chip sem badge — o clique abre o modal de login. */
  const favCountLabel = (state.currentCustomer && favCount > 0) ? ` (${favCount})` : '';
  const favChipHtml = `<button class="store-chip fav-chip ${lojaSoFavoritos?'active':''}" id="btnFavChip" title="${state.currentCustomer?'Ver seus favoritos':'Entre para salvar favoritos'}">
    <svg viewBox="0 0 24 24" fill="currentColor" style="width:12px;height:12px;vertical-align:-1px;margin-right:3px;flex-shrink:0;"><path d="M20.8 4.6a5.5 5.5 0 0 0-7.8 0L12 5.6l-1-1a5.5 5.5 0 0 0-7.8 7.8l1 1L12 21l7.8-7.8 1-1a5.5 5.5 0 0 0 0-7.6z"/></svg>Favoritos<span id="favChipCount">${favCountLabel}</span></button>`;

  let resultsMeta;
  if(lojaSoFavoritos && !list.length){
    /* Aba Favoritos sem resultados — diferencia logada de visitante */
    resultsMeta = state.currentCustomer
      ? 'Você ainda não tem favoritos salvos.'
      : 'Faça login para ver seus favoritos.';
  } else if(lojaSoFavoritos && list.length){
    /* Aba Favoritos com itens — sempre menciona "favoritos", ignorando busca secundária */
    const extra = lojaBusca.trim() ? ` · busca: "${escapeHtml(lojaBusca.trim())}"` : '';
    resultsMeta = `<b>${list.length}</b> peça${list.length===1?'':'s'} nos seus favoritos${extra}`;
  } else if(lojaBusca.trim() && !list.length){
    resultsMeta = `Nenhum resultado para "${escapeHtml(lojaBusca.trim())}"`;
  } else if(lojaBusca.trim()){
    resultsMeta = `<b>${list.length}</b> resultado${list.length===1?'':'s'} para "${escapeHtml(lojaBusca.trim())}"`;
  } else {
    resultsMeta = `<b>${list.length}</b> peça${list.length===1?'':'s'}${lojaCategoria!=='todas' ? ` em ${escapeHtml(lojaCategoria)}` : ''}`;
  }

  document.getElementById('storeView').innerHTML = `
    <div class="store">
      <header class="store-header">
        <div class="store-brand">
          <span class="b1">${escapeHtml(firstName)}</span>
          <span class="b2">Moda &amp; Cosméticos</span>
        </div>
        <div class="store-nav-right">
          ${state.currentCustomer ? `
            <div class="store-account-chip" id="accountChip">
              <span class="av">${escapeHtml(state.currentCustomer.nome.charAt(0).toUpperCase())}</span>
              <span>${escapeHtml(state.currentCustomer.nome.split(' ')[0])}</span>
            </div>` : isAdminLoggedIn() ? `
            <div class="store-account-chip" id="accountChip">
              <span class="av">${escapeHtml((adminSession.user.email||'A').charAt(0).toUpperCase())}</span>
              <span>${escapeHtml((adminSession.user.email||'').split('@')[0])}</span>
            </div>
            <button class="btn btn-gold btn-sm" id="btnGoAdmin">${ICON.dashboard} Painel</button>` : `
            <button class="btn btn-line btn-sm" id="btnLoginCustomer">Entrar</button>
            <button class="btn btn-ghost btn-sm" id="btnCreateAccount">${ICON.user} Criar conta</button>`}
          <button class="theme-toggle" id="btnThemeStore" aria-label="Alternar tema claro/escuro" type="button">${getTheme()==='light' ? ICON.moon : ICON.sun}</button>
          <a class="cart-btn" href="${instagramUrl()}" target="_blank" rel="noopener" aria-label="Abrir Instagram da loja" title="Siga no Instagram">${ICON.instagram}</a>
          <button class="cart-btn" id="btnOpenCart" aria-label="Abrir sacola">
            ${ICON.bag}
            <span class="cart-count" id="storeCartCount" style="display:${cartQty>0?'flex':'none'}">${cartQty}</span>
          </button>
        </div>
      </header>

      <section class="store-hero">
        <div class="hero-grid">
          <div class="hero-copy">
            <h1>Peças com presença,<br>para o seu dia a dia.</h1>
            <p>Vestuário, acessórios e cosméticos escolhidos um a um — do básico que vira favorito às ocasiões que pedem brilho.</p>
            <span class="hero-count">${totalCatalogo} peça${totalCatalogo===1?'':'s'} na coleção atual</span>
          </div>
          <div class="hero-panel">
            <div class="hero-panel-row"><span class="k">Toda semana</span><span class="v">Novidades na coleção</span></div>
            <div class="hero-panel-row"><span class="k">Direto com a loja</span><span class="v">Atendimento pelo WhatsApp</span></div>
            <div class="hero-panel-row"><span class="k">Sem compromisso</span><span class="v">Reserva antes de fechar</span></div>
          </div>
        </div>
      </section>

      <div class="store-body">
        ${renderInstagramSection()}
        <div class="store-toolbar">
          <div class="store-chip-tabs">
            ${chipTab('todas','Todas')}${CATEGORIAS.map(c=>chipTab(c,c)).join('')}${favChipHtml}
          </div>
          <div class="store-toolbar-right">
            <div class="store-search">
              ${ICON.search}
              <input type="text" id="lojaBuscaInput" placeholder="Buscar produto..." value="${escapeHtml(lojaBusca)}">
            </div>
            <select class="store-sort" id="lojaOrdenacaoSelect" aria-label="Ordenar por">
              ${ORDENACOES.map(o=>`<option value="${o.val}" ${lojaOrdenacao===o.val?'selected':''}>${o.label}</option>`).join('')}
            </select>
          </div>
        </div>
        <p class="store-results-meta">${resultsMeta}</p>

        ${list.length ? `<div class="store-grid">${list.map(renderProductCard).join('')}</div>` : (lojaSoFavoritos
          ? emptyState('Nenhum favorito ainda', state.currentCustomer ? 'Toque no ❤ de qualquer produto para salvá-lo aqui.' : 'Faça login para salvar e ver seus favoritos.', ICON.heart)
          : emptyState('Nenhum produto encontrado', 'Tente buscar por outro termo ou outra categoria.', ICON.produtos))}
      </div>

      <footer class="store-footer">
        <span class="fl">© ${new Date().getFullYear()} ${escapeHtml(storeName)}. Todos os direitos reservados.</span>
        <span class="fl"><a href="${instagramUrl()}" target="_blank" rel="noopener">Siga no Instagram</a></span>
      </footer>
    </div>`;

  bindStore();
}

function bindStore(){
  document.querySelectorAll('.instagram-mock-photo').forEach(img=>{
    img.addEventListener('error', ()=>{
      img.hidden = true;
    }, {once:true});
  });
  document.getElementById('btnOpenCart').addEventListener('click', openCart);
  const loginBtn = document.getElementById('btnLoginCustomer');
  if(loginBtn) loginBtn.addEventListener('click', openLoginCustomerModal);
  const createBtn = document.getElementById('btnCreateAccount');
  if(createBtn) createBtn.addEventListener('click', openCreateAccountModal);
  const btnThemeStore = document.getElementById('btnThemeStore');
  if(btnThemeStore) btnThemeStore.addEventListener('click', toggleTheme);
  const chip = document.getElementById('accountChip');
  if(chip) chip.addEventListener('click', ()=>{
    if(state.currentCustomer){
      confirmModal(`Deseja sair da conta de <strong>${escapeHtml(state.currentCustomer.nome)}</strong>?`, ()=>logoutCustomer());
    } else if(isAdminLoggedIn()){
      confirmModal(`Deseja sair da conta de administradora <strong>${escapeHtml(adminSession.user.email||'')}</strong>?`, ()=>logoutAdmin());
    }
  });
  const btnGoAdmin = document.getElementById('btnGoAdmin');
  if(btnGoAdmin) btnGoAdmin.addEventListener('click', showAdmin);

  document.querySelectorAll('[data-loja-cat]').forEach(b=>b.addEventListener('click', ()=>{
    state.ui.lojaCategoria = b.dataset.lojaCat;
    state.ui.lojaSoFavoritos = false; // desativa filtro de favoritos ao trocar categoria
    renderStore();
  }));
  const btnFavChip = document.getElementById('btnFavChip');
  if(btnFavChip) btnFavChip.addEventListener('click', ()=>{
    if(!state.currentCustomer){
      /* Visitante sem login: informa o motivo antes de abrir o modal */
      toast('Entre na sua conta para ver e salvar favoritos.', 'info');
      openLoginCustomerModal();
      return;
    }
    state.ui.lojaSoFavoritos = !state.ui.lojaSoFavoritos;
    /* Ao ativar a aba de favoritos, limpa o filtro de categoria para não
       esconder itens favoritados que estejam em outra categoria ativa */
    if(state.ui.lojaSoFavoritos) state.ui.lojaCategoria = 'todas';
    renderStore();
  });
  const ordenacaoSelect = document.getElementById('lojaOrdenacaoSelect');
  if(ordenacaoSelect) ordenacaoSelect.addEventListener('change', ()=>{
    state.ui.lojaOrdenacao = ordenacaoSelect.value; renderStore();
  });
  const buscaInput = document.getElementById('lojaBuscaInput');
  buscaInput.addEventListener('input', ()=>{
    state.ui.lojaBusca = buscaInput.value;
    renderStore();
    const el = document.getElementById('lojaBuscaInput');
    if(el){ el.focus(); el.setSelectionRange(el.value.length, el.value.length); }
  });

  document.querySelectorAll('.p-fav-btn[data-fav]').forEach(btn=>btn.addEventListener('click', (e)=>{
    e.stopPropagation(); // evita abrir o modal do produto
    toggleFavorite(btn.dataset.fav);
  }));
  document.querySelectorAll('[data-size-choice]').forEach(opt=>opt.addEventListener('click', ()=>{
    const [pid, size] = opt.dataset.sizeChoice.split('|');
    state.ui.cartSizeSel[pid] = size;
    renderStore();
  }));
  document.querySelectorAll('[data-add-cart]').forEach(b=>b.addEventListener('click', ()=>{
    addToCart(b.dataset.addCart);
  }));
  document.querySelectorAll('[data-open-product]').forEach(el=>{
    el.addEventListener('click', ()=>openProductModal(el.dataset.openProduct));
    el.addEventListener('keydown', (e)=>{ if(e.key==='Enter'||e.key===' ') openProductModal(el.dataset.openProduct); });
  });
}

/* ============================================================
   MODAL DE PRODUTO (detalhe full-screen drawer)
   ============================================================ */
function openProductModal(productId){
  const p = state.products.find(x=>x.id===productId);
  if(!p) return;

  const fotos = productFotos(p);
  const soldOut = p.estoque < 1;
  const lowStock = !soldOut && p.estoque <= (state.settings.lowStockThreshold||3);
  const needsSize = p.sizes && p.sizes.length && !(p.sizes.length===1 && p.sizes[0]==='Único');

  // Produtos relacionados (mesma categoria, excluindo o atual, máx. 4)
  const relacionados = state.products
    .filter(x=>x.id!==p.id && x.categoria===p.categoria && x.estoque>0)
    .slice(0,4);

  function thumbsHtml(){
    if(fotos.length<=1) return '';
    return `<div class="pmodal-thumbs" id="pmThumbs">
      ${fotos.map((url,i)=>`
        <div class="pmodal-thumb ${i===0?'active':''}" data-pm-thumb="${i}">
          <img src="${url}" alt="foto ${i+1}">
        </div>`).join('')}
    </div>`;
  }

  function mainImgHtml(idx){
    idx = idx||0;
    if(fotos.length){
      return `<img src="${fotos[idx]}" alt="${escapeHtml(p.nome)}" id="pmMainImg">`;
    }
    const tint = CATEGORY_TINT[p.categoria]||'#1c191b, #0d0c0d';
    return `<span class="glyph">${productGlyph(p.nome)}</span>`;
  }

  const relacionadosHtml = relacionados.length ? `
    <div class="pmodal-related">
      <div class="pmodal-related-head">Veja também</div>
      <div class="pmodal-related-grid">
        ${relacionados.map(r=>{
          const rf = productFotos(r);
          return `
          <div class="prelated-card" data-open-product="${r.id}" role="button" tabindex="0" aria-label="Ver ${escapeHtml(r.nome)}">
            <div class="prelated-media" style="${productMediaStyle(r)}">
              <span class="glyph">${productGlyph(r.nome)}</span>
              ${productCoverImgHtml(r, rf)}
            </div>
            <div class="prelated-name">${escapeHtml(r.nome)}</div>
            <div class="prelated-price">${money(r.preco)}</div>
          </div>`;
        }).join('')}
      </div>
    </div>` : '';

  const selectedSize = state.ui.cartSizeSel[p.id] || (p.sizes&&p.sizes.length===1?p.sizes[0]:'');

  const sizesHtml = needsSize ? `
    <div>
      <div class="pmodal-section-label">Tamanho</div>
      <div class="pmodal-size-row" id="pmSizes">
        ${p.sizes.map(s=>`
          <div class="pmodal-size-opt ${selectedSize===s?'sel':''}" data-pm-size="${s}">${escapeHtml(s)}</div>`).join('')}
      </div>
    </div>` : '';

  const statusHtml = soldOut
    ? `<span class="tag tag-danger" style="align-self:flex-start;">Esgotado</span>`
    : lowStock
      ? `<span class="tag tag-warn" style="align-self:flex-start;">Últimas peças — ${p.estoque} un.</span>`
      : '';

  const descHtml = p.descricao
    ? `<div><div class="pmodal-section-label">Sobre a peça</div><p class="pmodal-desc">${escapeHtml(p.descricao)}</p></div>`
    : '';

  const corHtml = p.cor && p.cor !== '—'
    ? `<div style="font-size:12px; color:var(--text-faint);">Cor: <span style="color:var(--text-muted);">${escapeHtml(p.cor)}</span></div>`
    : '';

  const root = document.getElementById('modalRoot');
  root.innerHTML = `
    <div class="pmodal-overlay" id="pmodalOverlay" role="dialog" aria-modal="true" aria-label="${escapeHtml(p.nome)}">
      <div class="pmodal">
        <div class="pmodal-head">
          <div class="pmodal-breadcrumb">
            <span>${escapeHtml(p.categoria)}</span>
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" width="12" height="12"><path d="m9 18 6-6-6-6"/></svg>
            <span style="color:var(--text);">${escapeHtml(p.nome)}</span>
          </div>
          <button class="modal-close" id="pmodalClose" aria-label="Fechar">${ICON.close}</button>
        </div>

        <div class="pmodal-body" id="pmodalBody">
          <!-- Galeria -->
          <div class="pmodal-gallery">
            <div class="pmodal-main-img" style="${productMediaStyle(p)}" id="pmMainWrap">
              ${mainImgHtml(0)}
            </div>
            ${thumbsHtml()}
          </div>

          <!-- Detalhes -->
          <div class="pmodal-detail">
            <div>
              <div class="pmodal-cat">${escapeHtml(p.categoria)}</div>
              <h2 class="pmodal-name">${escapeHtml(p.nome)}</h2>
              ${corHtml}
            </div>
            <div class="pmodal-price">${money(p.preco)}</div>
            ${statusHtml}
            ${descHtml}
            ${sizesHtml}
            <button class="pmodal-add-btn" id="pmAddBtn" ${soldOut?'disabled':''}>
              ${soldOut ? 'Esgotado' : `${ICON.bag} Adicionar à sacola`}
            </button>
          </div>

          <!-- Produtos relacionados (full-width abaixo) -->
          ${relacionadosHtml}
        </div>
      </div>
    </div>`;

  // Fechar
  document.getElementById('pmodalClose').addEventListener('click', closeModal);
  document.getElementById('pmodalOverlay').addEventListener('click', (e)=>{
    if(e.target.id==='pmodalOverlay') closeModal();
  });
  document.addEventListener('keydown', escCloseOnce);

  // Miniaturas
  root.querySelectorAll('[data-pm-thumb]').forEach(thumb=>{
    thumb.addEventListener('click', ()=>{
      const idx = +thumb.dataset.pmThumb;
      const wrap = document.getElementById('pmMainWrap');
      if(wrap){
        wrap.innerHTML = `<img src="${fotos[idx]}" alt="${escapeHtml(p.nome)}" id="pmMainImg">`;
      }
      root.querySelectorAll('[data-pm-thumb]').forEach(t=>t.classList.toggle('active', +t.dataset.pmThumb===idx));
    });
  });

  // Seleção de tamanho no modal de produto
  let pmSelectedSize = selectedSize;
  root.querySelectorAll('[data-pm-size]').forEach(opt=>{
    opt.addEventListener('click', ()=>{
      pmSelectedSize = opt.dataset.pmSize;
      state.ui.cartSizeSel[p.id] = pmSelectedSize;
      root.querySelectorAll('[data-pm-size]').forEach(o=>o.classList.toggle('sel', o.dataset.pmSize===pmSelectedSize));
    });
  });

  // Adicionar à sacola
  const addBtn = document.getElementById('pmAddBtn');
  if(addBtn && !soldOut){
    addBtn.addEventListener('click', ()=>{
      if(needsSize && !pmSelectedSize){
        toast('Selecione um tamanho antes de adicionar.', 'danger'); return;
      }
      // Usa o tamanho selecionado no modal (já sincronizado em state.ui.cartSizeSel)
      addToCart(p.id);
    });
  }

  // Produtos relacionados — abrir outro modal
  root.querySelectorAll('[data-open-product]').forEach(el=>{
    el.addEventListener('click', ()=>{ closeModal(); openProductModal(el.dataset.openProduct); });
    el.addEventListener('keydown', (e)=>{ if(e.key==='Enter'||e.key===' '){ closeModal(); openProductModal(el.dataset.openProduct); }});
  });
}

function addToCart(productId){
  const p = state.products.find(x=>x.id===productId);
  if(!p) return;
  if(p.estoque<1){ toast('Este produto está esgotado.', 'danger'); return; }
  const needsSize = p.sizes && p.sizes.length && !(p.sizes.length===1 && p.sizes[0]==='Único');
  const chosenSize = state.ui.cartSizeSel[productId];
  if(needsSize && !chosenSize){ toast('Selecione um tamanho antes de adicionar.', 'danger'); return; }
  const size = chosenSize || (p.sizes && p.sizes.length===1 ? p.sizes[0] : 'Único');

  const existing = state.cart.find(c=>c.productId===productId && c.tamanho===size);
  if(existing){ existing.qtd += 1; }
  else { state.cart.push({productId, nome:p.nome, tamanho:size, preco:p.preco, qtd:1}); }
  persistCart();
  toast('Adicionado à sacola.', 'success');
  renderStore();
}

/* ---------- Carrinho (sacola) ---------- */
function openCart(){
  const root = document.getElementById('cartRoot');
  const total = state.cart.reduce((s,i)=>s+i.preco*i.qtd,0);
  root.innerHTML = `
    <div class="cart-overlay" id="cartOverlay">
      <div class="cart-drawer" role="dialog" aria-label="Sacola de compras">
        <div class="cart-drawer-head">
          <h3>Sua sacola</h3>
          <button class="modal-close" id="cartCloseBtn" aria-label="Fechar">${ICON.close}</button>
        </div>
        <div class="cart-drawer-body">
          ${state.cart.length ? state.cart.map((it,idx)=>{
            const prod = state.products.find(x=>x.id===it.productId);
            const tint = prod ? productMediaStyle(prod) : '--p-media:linear-gradient(165deg, #1c191b, #0d0c0d);';
            const primeiraFoto = prod ? (productFotos(prod)[0]||'') : '';
            const thumbContent = primeiraFoto
              ? `<img src="${primeiraFoto}" alt="${escapeHtml(it.nome)}" style="width:100%;height:100%;object-fit:cover;display:block;">`
              : `<span class="glyph">${productGlyph(it.nome)}</span>`;
            return `
            <div class="cd-item">
              <div class="cd-thumb" style="${tint}">${thumbContent}</div>
              <div class="cd-info">
                <div class="n">${escapeHtml(it.nome)}</div>
                <div class="m">Tam. ${escapeHtml(it.tamanho)}</div>
                <div class="cd-qty">
                  <button class="qty-btn" data-cart-dec="${idx}" aria-label="Diminuir quantidade">−</button>
                  <span class="qn">${it.qtd}</span>
                  <button class="qty-btn" data-cart-inc="${idx}" aria-label="Aumentar quantidade">+</button>
                </div>
              </div>
              <div class="cd-right">
                <button class="cd-remove" data-cart-rm="${idx}" aria-label="Remover item">${ICON.trash}</button>
                <span class="amt">${money(it.preco*it.qtd)}</span>
              </div>
            </div>`;
          }).join('') : `<div class="cart-empty">${ICON.bag}<div>Sua sacola está vazia.</div></div>`}
        </div>
        <div class="cart-drawer-foot">
          <div class="cart-total-row"><span class="lbl">Total</span><span>${money(total)}</span></div>
          ${PAGAMENTO_ONLINE_ATIVO ? `
          <div class="cart-checkout-row">
            <button class="btn-mp" id="cartBtnMP" ${state.cart.length?'':'disabled'}>${ICON.pay} Pagar agora (Pix/Cartão)</button>
            <button class="btn-wpp" id="cartCheckout" ${state.cart.length?'':'disabled'}>${ICON.whatsapp} WhatsApp</button>
          </div>
          <p style="font-size:10.5px; color:var(--text-faint); text-align:center; margin-top:9px;">
            Pague online com Pix ou cartão — ou finalize pelo WhatsApp para combinar diretamente com a loja.
          </p>` : `
          <div style="margin-top:14px;">
            <button class="btn-wpp" id="cartCheckout" style="width:100%;" ${state.cart.length?'':'disabled'}>${ICON.whatsapp} Finalizar pelo WhatsApp</button>
          </div>
          <p style="font-size:10.5px; color:var(--text-faint); text-align:center; margin-top:9px;">
            Finalize seu pedido pelo WhatsApp para combinar pagamento e entrega diretamente com a loja.
          </p>`}
        </div>
      </div>
    </div>`;
  document.getElementById('cartCloseBtn').addEventListener('click', closeCart);
  document.getElementById('cartOverlay').addEventListener('click', (e)=>{ if(e.target.id==='cartOverlay') closeCart(); });
  root.querySelectorAll('[data-cart-inc]').forEach(b=>b.addEventListener('click', ()=>{
    state.cart[+b.dataset.cartInc].qtd++; persistCart(); openCart(); syncCartBadge();
  }));
  root.querySelectorAll('[data-cart-dec]').forEach(b=>b.addEventListener('click', ()=>{
    const idx = +b.dataset.cartDec;
    state.cart[idx].qtd--;
    if(state.cart[idx].qtd<=0) state.cart.splice(idx,1);
    persistCart(); openCart(); syncCartBadge();
  }));
  root.querySelectorAll('[data-cart-rm]').forEach(b=>b.addEventListener('click', ()=>{
    state.cart.splice(+b.dataset.cartRm,1); persistCart(); openCart(); syncCartBadge();
  }));
  /* ── Botão WhatsApp (opção B): salva venda pendente antes de abrir link ── */
  const checkoutBtn = document.getElementById('cartCheckout');
  if(checkoutBtn && !checkoutBtn.disabled) checkoutBtn.addEventListener('click', async ()=>{
    const url = whatsappCheckoutUrl();
    if(!url){
      toast('Cadastre o WhatsApp da loja em Configurações para habilitar o envio do pedido.', 'danger');
      return;
    }

    /* Monta e salva a venda pendente usando a mesma estrutura de state.sales */
    const itensVenda = state.cart.map(it=>({
      productId: it.productId,
      nome:      it.nome,
      tamanho:   it.tamanho,
      preco:     it.preco,
      qtd:       it.qtd
    }));
    const vendaPendente = {
      id:       uid('v'),
      cliente:  state.currentCustomer ? state.currentCustomer.nome : 'Cliente (loja online)',
      telefone: state.currentCustomer ? (state.currentCustomer.telefone||'') : '',
      date:     todayISO(),
      tipo:     'vista',           // pedidos da loja são sempre à vista; pode ser ajustado
      itens:    itensVenda,
      total:    state.cart.reduce((s,i)=>s+i.preco*i.qtd, 0),
      status:   'aguardando_wpp', // status especial: aguardando confirmação da loja
      parcelas: [],
      origem:   'carrinho_wpp'    // marca a origem para a view de Vendas distinguir
    };
    state.sales.push(vendaPendente);
    /* Persiste sem await para não atrasar a abertura do WhatsApp */
    persistSales().catch(e=>console.warn('[Vendas] falha ao salvar pedido WPP:', e.message||e));

    /* Limpa o carrinho após registrar */
    state.cart = [];
    persistCart();
    syncCartBadge();

    window.open(url, '_blank', 'noopener');
    closeCart();
    toast('Pedido salvo! Confirme na aba Vendas após o pagamento.', 'info');
  });

  /* ── Botão "Pagar agora" — Mercado Pago Checkout Pro (opção A) ── */
  const mpBtn = document.getElementById('cartBtnMP');
  if(mpBtn && !mpBtn.disabled) mpBtn.addEventListener('click', onlineCheckout);
}
function closeCart(){
  document.getElementById('cartRoot').innerHTML = '';
}
function syncCartBadge(){
  const el = document.getElementById('storeCartCount');
  if(!el) return;
  const qty = state.cart.reduce((s,i)=>s+i.qtd,0);
  el.textContent = qty;
  el.style.display = qty>0 ? 'flex' : 'none';
}

/* ---------- Conta da cliente ---------- */
function openCreateAccountModal(){
  openModal({
    title:'Criar conta',
    bodyHtml:`
      <div class="form-grid">
        <div class="field span2"><label for="caNome">Nome completo</label><input type="text" id="caNome" placeholder="Seu nome"></div>
        <div class="field span2"><label for="caEmail">E-mail</label><input type="email" id="caEmail" placeholder="seuemail@exemplo.com"></div>
        <div class="field span2"><label for="caTel">Telefone <span class="hint">opcional</span></label><input type="tel" id="caTel" placeholder="(45) 99999-9999"></div>
        <div class="field"><label for="caSenha">Senha</label><input type="password" id="caSenha" placeholder="Mínimo 6 caracteres"></div>
        <div class="field"><label for="caSenha2">Confirmar senha</label><input type="password" id="caSenha2" placeholder="Repita a senha"></div>
      </div>
      <div id="caError" style="display:none; font-size:11.5px; color:var(--danger); margin-top:4px;"></div>
    `,
    footHtml:`<button class="btn btn-line" id="caCancel">Cancelar</button><button class="btn btn-gold" id="caSave">Criar conta</button>`,
    onMount:(root)=>{
      root.querySelector('#caCancel').addEventListener('click', closeModal);
      const saveBtn = root.querySelector('#caSave');
      const saveBtnOriginal = saveBtn.innerHTML;

      saveBtn.addEventListener('click', async ()=>{
        const nome = root.querySelector('#caNome').value.trim();
        const email = root.querySelector('#caEmail').value.trim().toLowerCase();
        const tel = root.querySelector('#caTel').value.trim();
        const senha = root.querySelector('#caSenha').value;
        const senha2 = root.querySelector('#caSenha2').value;

        if(!nome || !email){ toast('Preencha nome e e-mail.', 'danger'); return; }
        if(!senha || senha.length<6){ toast('A senha deve ter pelo menos 6 caracteres.', 'danger'); return; }
        if(senha!==senha2){ toast('As senhas não coincidem.', 'danger'); return; }
        if(!sb){ toast('Serviço indisponível. Tente novamente mais tarde.', 'danger'); return; }

        saveBtn.disabled = true;
        saveBtn.textContent = 'Criando conta...';

        try{
          const { data, error } = await sb.auth.signUp({
            email,
            password: senha,
            options: { data: { nome, telefone: tel } }
          });

          if(error) throw error;

          // Sem confirmação de e-mail: o Supabase já devolve a sessão.
          let sessao = data && data.session;
          if(!sessao){
            // Confirmação de e-mail ainda ligada no painel do Supabase → tenta entrar direto.
            const { data: dl, error: el } = await sb.auth.signInWithPassword({ email, password: senha });
            if(el){
              throw new Error('Conta criada, mas o Supabase ainda exige confirmação de e-mail. Desative "Confirm email" em Authentication → Providers → Email.');
            }
            sessao = dl.session;
          }

          // Grava a conta na tabela customers e entra logada.
          const { error: custError } = await sb.from('customers').upsert(
            { id: sessao.user.id, nome, email, telefone: tel }, { onConflict: 'id' });
          if(custError) console.warn('[DB] falha ao gravar em customers.', custError.message);

          await applyAuthSession(sessao);
          await loadFavorites();
          toast(`Conta criada! Bem-vinda, ${nome.split(' ')[0]}.`, 'success');
          closeModal();
          renderStore();
        }catch(e){
          console.warn('[Auth] falha ao criar conta.', e.message||e);
          const msg = e.message && e.message.includes('already registered')
            ? 'Já existe uma conta com este e-mail.'
            : (e.message || 'Não foi possível criar a conta. Tente novamente.');
          toast(msg, 'danger');
          saveBtn.disabled = false;
          saveBtn.innerHTML = saveBtnOriginal;
        }
      });
    }
  });
}
function openLoginCustomerModal(){
  openModal({
    title:'Entrar',
    bodyHtml:`
      <div class="form-grid c1">
        <div class="field">
          <label for="liUser">E-mail</label>
          <input type="email" id="liUser" placeholder="seuemail@exemplo.com" autocomplete="username">
        </div>
        <div class="field">
          <label for="liSenha">Senha</label>
          <input type="password" id="liSenha" placeholder="Sua senha" autocomplete="current-password">
        </div>
      </div>
      <p style="font-size:11.5px; margin-top:10px;"><a href="#" id="liForgot" style="color:var(--text-faint);">Esqueci minha senha</a></p>
      <p style="font-size:12px; color:var(--text-faint); margin-top:10px;">Ainda não tem conta? <a href="#" id="liGoCreate" style="color:var(--gold-light);">Criar conta</a></p>
    `,
    footHtml:`<button class="btn btn-line" id="liCancel">Cancelar</button><button class="btn btn-gold" id="liEnter">${ICON.lock} Entrar</button>`,
    onMount:(root)=>{
      const enterBtn = root.querySelector('#liEnter');
      const enterBtnOriginal = enterBtn.innerHTML;

      root.querySelector('#liCancel').addEventListener('click', closeModal);
      root.querySelector('#liGoCreate').addEventListener('click', (e)=>{ e.preventDefault(); closeModal(); openCreateAccountModal(); });
      root.querySelector('#liForgot').addEventListener('click', (e)=>{
        e.preventDefault();
        const prefill = root.querySelector('#liUser').value.trim();
        closeModal();
        openForgotPasswordModal(prefill);
      });

      const setLoading = (on)=>{
        enterBtn.disabled = on;
        enterBtn.innerHTML = on ? 'Entrando...' : enterBtnOriginal;
      };

      const doLogin = async ()=>{
        const email = root.querySelector('#liUser').value.trim();
        const senha = root.querySelector('#liSenha').value;
        if(!email || !senha){ toast('Preencha e-mail e senha.', 'danger'); return; }
        if(!sb){ toast('Serviço indisponível. Tente novamente mais tarde.', 'danger'); return; }

        setLoading(true);

        try{
          const { data, error } = await sb.auth.signInWithPassword({ email, password: senha });

          if(error) throw error;

          if(data && data.session){
            await applyAuthSession(data.session);

            if(isAdminLoggedIn()){
              closeModal();
              toast('Acesso liberado. Bem-vinda à gestão.', 'success');
              showAdmin();
            } else if(state.currentCustomer){
              await loadFavorites();
              closeModal();
              toast(`Bem-vinda de volta, ${(state.currentCustomer.nome||'').split(' ')[0]}.`, 'success');
              renderStore();
            }
            return;
          }
        }catch(e){
          console.warn('[Auth] falha no login.', e.message||e);
          setLoading(false);
          const msg = (e.message && (e.message.includes('Invalid login') || e.message.includes('invalid_credentials')))
            ? 'E-mail ou senha incorretos.'
            : (e.message || 'Não foi possível entrar. Tente novamente.');
          toast(msg, 'danger');
          return;
        }

        setLoading(false);
        toast('E-mail ou senha incorretos.', 'danger');
      };

      enterBtn.addEventListener('click', doLogin);
      root.querySelector('#liUser').addEventListener('keydown', e=>{ if(e.key==='Enter') root.querySelector('#liSenha').focus(); });
      root.querySelector('#liSenha').addEventListener('keydown', e=>{ if(e.key==='Enter') doLogin(); });
      root.querySelector('#liUser').focus();
    }
  });
}

function openForgotPasswordModal(prefillEmail){
  openModal({
    title:'Recuperar senha',
    bodyHtml:`
      <p style="font-size:12.5px; color:var(--text-muted); margin-top:0; line-height:1.6;">
        Informe o e-mail cadastrado na sua conta. Se o endereço estiver correto, você receberá um link para criar uma nova senha.
      </p>
      <div class="form-grid c1">
        <div class="field">
          <label for="fpEmail">E-mail</label>
          <input type="email" id="fpEmail" placeholder="seuemail@exemplo.com" value="${escapeHtml(prefillEmail||'')}">
        </div>
      </div>
    `,
    footHtml:`<button class="btn btn-line" id="fpCancel">Cancelar</button><button class="btn btn-gold" id="fpSend">Enviar link de recuperação</button>`,
    onMount:(root)=>{
      root.querySelector('#fpCancel').addEventListener('click', closeModal);
      const sendBtn = root.querySelector('#fpSend');
      const original = sendBtn.innerHTML;
      root.querySelector('#fpSend').addEventListener('click', async ()=>{

        if(!email){ toast('Informe o e-mail.', 'danger'); return; }

        sendBtn.disabled = true; sendBtn.textContent = 'Enviando...';
        try{
          const { error } = await sb.auth.resetPasswordForEmail(email, {
            redirectTo: window.location.href
          });
          if(error) throw error;
          toast('Se este e-mail estiver cadastrado, você receberá as instruções em breve.', 'success');
          closeModal();

          console.warn('[Auth] falha ao enviar e-mail de recuperação.', e.message||e);
          toast('Não foi possível enviar o e-mail agora. Tente novamente mais tarde.', 'danger');
          sendBtn.disabled = false; sendBtn.innerHTML = original;
        }
      });
      root.querySelector('#fpEmail').focus();
    }
  });

/* ============================================================
   FAVORITOS — Supabase table: favorites (customer_id, product_id)
   SQL para criar a tabela (rode no SQL Editor do Supabase):

   create table if not exists favorites (
     customer_id uuid references auth.users(id) on delete cascade,
     product_id  text not null,
     created_at  timestamptz default now(),
     primary key (customer_id, product_id)
   );
   alter table favorites enable row level security;
   create policy "cliente vê seus favoritos"   on favorites for select using (auth.uid() = customer_id);
   create policy "cliente insere favorito"      on favorites for insert with check (auth.uid() = customer_id);
   create policy "cliente remove favorito"      on favorites for delete using (auth.uid() = customer_id);
   ============================================================ */

async function loadFavorites(){
  if(!sb || !state.currentCustomer) { state.favorites = new Set(); return; }
  try{
    const { data, error } = await sb
      .from('favorites')
      .select('product_id')
      .eq('customer_id', state.currentCustomer.id);
    if(error) throw error;
    state.favorites = new Set((data||[]).map(r=>r.product_id));
  }catch(e){
    console.warn('[Favorites] falha ao carregar favoritos.', e.message||e);
    state.favorites = new Set();
  }
}

async function toggleFavorite(productId){
  if(!state.currentCustomer){
    openLoginCustomerModal();
    return;
  }
  const isFav = state.favorites.has(productId);
  if(isFav){
    state.favorites.delete(productId);
    if(sb){
      try{
        await sb.from('favorites')
          .delete()
          .eq('customer_id', state.currentCustomer.id)
          .eq('product_id', productId);
      }catch(e){ console.warn('[Favorites] falha ao remover favorito.', e.message||e); }
    }
  } else {
    state.favorites.add(productId);
    if(sb){
      try{
        await sb.from('favorites')
          .upsert({ customer_id: state.currentCustomer.id, product_id: productId }, { onConflict:'customer_id,product_id' });
      }catch(e){ console.warn('[Favorites] falha ao salvar favorito.', e.message||e); }
    }
  }
  /* Atualiza só o botão do card afetado — sem re-renderizar a loja inteira */
  const btn = document.querySelector(`.p-fav-btn[data-fav="${productId}"]`);
  if(btn){
    const nowFav = state.favorites.has(productId);
    btn.classList.toggle('fav', nowFav);
    btn.innerHTML = nowFav ? ICON.heartFill : ICON.heart;
    btn.setAttribute('aria-label', nowFav ? 'Remover dos favoritos' : 'Adicionar aos favoritos');
    btn.classList.add('pop');
    btn.addEventListener('animationend', ()=>btn.classList.remove('pop'), {once:true});
  }
  /* Atualiza a contagem da aba Favoritos sem re-render completo.
     Só exibe badge numérico quando a cliente está logada (mesma regra do render). */
  const favChip = document.getElementById('favChipCount');
  if(favChip){
    favChip.textContent = (state.currentCustomer && state.favorites.size)
      ? ` (${state.favorites.size})` : '';
  }
  /* Se estiver na aba Favoritos e removeu um item, re-renderiza:
     — quando o card removido precisa desaparecer da grade filtrada
     — quando era o último e temos de mostrar o empty-state */
  if(state.ui.lojaSoFavoritos && isFav){
    renderStore();
  }
}

}

async function uploadFotoProduto(file, produtoId){
  if(!sb) throw new Error('Supabase não configurado');
  const ext = file.name.split('.').pop().toLowerCase();
  const path = `${produtoId}.${ext}`;
  // Remove foto antiga se existir
  await sb.storage.from('produtos').remove([path]).catch(()=>{});
  const { error } = await sb.storage.from('produtos').upload(path, file, {
    upsert: true,
    contentType: file.type
  });
  if(error) throw error;
  const { data } = sb.storage.from('produtos').getPublicUrl(path);
  return data.publicUrl;
}

async function removerFotoProduto(fotoUrl){
  if(!sb || !fotoUrl) return;
  try{
    // Extrai o path do final da URL pública
    const parts = fotoUrl.split('/produtos/');
    if(parts[1]) await sb.storage.from('produtos').remove([parts[1]]);
  }catch(e){ console.warn('[Storage] falha ao remover foto:', e); }
}

  const footHtml = `
    <button class="btn btn-line" id="pCancel">Cancelar</button>
    <button class="btn btn-gold" id="pSave">${editing?'Salvar alterações':'Cadastrar produto'}</button>
  `;

  openModal({
    title: editing ? 'Editar produto' : 'Novo produto',
    bodyHtml, footHtml, wide: true,
    onMount:(root)=>{
      // ── Grid de fotos
      const fotosGridEl = root.querySelector('#fotosGrid');
      const fotoStatus = root.querySelector('#fotoStatus');
      renderFotosGrid(fotosGridEl);

      // ── Tamanhos
      const picker = root.querySelector('#sizePicker');
      picker.querySelectorAll('.size-opt').forEach(opt=>{
        opt.addEventListener('click', ()=>{
          const s = opt.dataset.size;
          if(draft.sizes.includes(s)){
            draft.sizes = draft.sizes.filter(x=>x!==s);
            opt.classList.remove('selected');
          }else{
            draft.sizes.push(s);
            opt.classList.add('selected');
          }
        });
      });
      root.querySelector('#addCustomSize').addEventListener('click', ()=>{
        const input = root.querySelector('#fCustomSize');
        const v = input.value.trim();
        if(!v) return;
        if(!draft.sizes.includes(v)){
          draft.sizes.push(v);
          const el = document.createElement('div');
          el.className = 'size-opt selected';
          el.dataset.size = v;
          el.textContent = v;
          el.addEventListener('click', ()=>{
            draft.sizes = draft.sizes.filter(x=>x!==v);
            el.remove();
          });
          picker.appendChild(el);
        }
        input.value='';
      });

      root.querySelector('#pCancel').addEventListener('click', closeModal);
      const pSaveBtn = root.querySelector('#pSave');
      const pSaveOriginal = pSaveBtn.innerHTML;
      const setProdLoading = (on, msg)=>{
        pSaveBtn.disabled = on;
        pSaveBtn.innerHTML = on ? (msg||'Salvando…') : pSaveOriginal;
      };

      root.querySelector('#pSave').addEventListener('click', async ()=>{
        const nome = root.querySelector('#fNome').value.trim();
        const preco = parseFloat(root.querySelector('#fPreco').value);
        const estoque = parseInt(root.querySelector('#fEstoque').value,10);

        if(!nome){ toast('Informe o nome do produto.', 'danger'); return; }
        if(isNaN(preco) || preco<0){ toast('Informe um preço válido.', 'danger'); return; }
        if(isNaN(estoque) || estoque<0){ toast('Informe uma quantidade de estoque válida.', 'danger'); return; }

        const prodId = draft.id || uid('p');

        setProdLoading(true, 'Salvando…');

        // Upload das fotos novas
        const fotosFinais = [];
        const novas = fotosState.filter(f=>f.isNew && f.file);
        const existentes = fotosState.filter(f=>!f.isNew);

        // Fotos existentes (URLs já no Supabase) vão direto
        existentes.forEach(f=>fotosFinais.push(f.url));

        // Upload das novas
        if(novas.length){
          setProdLoading(true, `Enviando ${novas.length} foto${novas.length>1?'s':''}…`);
          fotoStatus.textContent = `Enviando fotos (${novas.length})…`;
          fotoStatus.className = 'foto-upload-status uploading';
        }
        for(let i=0;i<novas.length;i++){
          const f = novas[i];
          try{
            // Para múltiplas fotos: path = prodId_0.ext, prodId_1.ext…
            const ext = f.file.name.split('.').pop().toLowerCase();
            const slot = `${prodId}_${Date.now()}_${i}`;
            const path = `${slot}.${ext}`;
            await sb.storage.from('produtos').upload(path, f.file, {upsert:true, contentType:f.file.type});
            const {data} = sb.storage.from('produtos').getPublicUrl(path);
            fotosFinais.push(data.publicUrl);
          }catch(err){
            fotoStatus.textContent = 'Erro ao enviar foto ' + (i+1) + ': ' + (err.message||err);
            fotoStatus.className = 'foto-upload-status error';
            setProdLoading(false);
            toast('Erro ao enviar foto. Verifique o bucket no Supabase.', 'danger');
            return;
          }
        }
        if(novas.length){
          fotoStatus.textContent = 'Fotos enviadas!';
          fotoStatus.className = 'foto-upload-status done';
        }

        // Reordenar: manter a ordem do fotosState (existentes na frente)
        // Na prática fotosFinais já está na ordem certa (existentes + novas)
        const fotosOrdenadas = [
          ...existentes.map(f=>f.url),
          ...fotosFinais.slice(existentes.length)
        ];

        const payload = {
          id: prodId,
          nome,
          categoria: root.querySelector('#fCategoria').value,
          sku: root.querySelector('#fSku').value.trim(),
          cor: root.querySelector('#fCor').value.trim(),
          sizes: draft.sizes,
          preco,
          custo: root.querySelector('#fCusto').value ? parseFloat(root.querySelector('#fCusto').value) : null,
          estoque,
          descricao: root.querySelector('#fDescricao').value.trim(),
          fotos: fotosOrdenadas,
          // fotoUrl legado: usa a primeira foto para retrocompatibilidade
          fotoUrl: fotosOrdenadas[0] || ''
        };

        if(editing){
          const idx = state.products.findIndex(x=>x.id===draft.id);
          state.products[idx] = payload;
        }else{
          state.products.push(payload);
        }

        const salvouNoBanco = await persistProducts();

        setProdLoading(false);
        // Se salvouNoBanco for false, db.saveProducts() já mostrou o toast
        // explicando o motivo (coluna ausente, permissão, etc.) — não duplica aqui.
        if(salvouNoBanco){
          toast(editing ? 'Produto atualizado.' : 'Produto cadastrado.', 'success');
        }
        closeModal();
        render();
      });
    }
  });
}

function viewVendas(){
  const { vendasFiltro, vendasBusca } = state.ui;
  let list = state.sales.slice();
  if(vendasFiltro==='vista')    list = list.filter(s=>s.tipo==='vista');
  if(vendasFiltro==='prazo')    list = list.filter(s=>s.tipo==='prazo');
  if(vendasFiltro==='pendente') list = list.filter(s=>s.status==='pendente'||s.status==='parcial');
  /* Filtro dedicado: pedidos enviados pelo WhatsApp da loja ainda não confirmados */
  if(vendasFiltro==='whatsapp') list = list.filter(s=>s.status==='aguardando_wpp');
  if(vendasBusca.trim()){
    const q = vendasBusca.trim().toLowerCase();
    list = list.filter(s=>s.cliente.toLowerCase().includes(q));
  }
  /* Pendentes WPP sempre no topo; dentro do mesmo status, mais recentes primeiro */
  list.sort((a,b)=>{
    const aw = a.status==='aguardando_wpp'?0:1;
    const bw = b.status==='aguardando_wpp'?0:1;
    if(aw!==bw) return aw-bw;
    return b.date.localeCompare(a.date);
  });

  const totalFiltrado = list
    .filter(s=>s.status!=='aguardando_wpp')   // não soma pedidos não confirmados
    .reduce((s,v)=>s+v.total,0);

  const pendentesWpp = state.sales.filter(s=>s.status==='aguardando_wpp').length;

  return `
    <div class="section-head">
      <div>
        <h2>Vendas</h2>
        <p>${list.length} venda${list.length===1?'':'s'} · ${money(totalFiltrado)} confirmado no período exibido</p>
      </div>
      <button class="btn btn-gold" id="btnNovaVenda">${ICON.plus} Registrar venda</button>
    </div>

    <div class="toolbar">
      <div class="chip-tabs">
        ${chip('todas','Todas')}${chip('vista','À vista')}${chip('prazo','A prazo')}${chip('pendente','Pendentes')}
        <button class="chip-tab ${vendasFiltro==='whatsapp'?'active':''}" data-filtro="whatsapp" style="position:relative;">
          WhatsApp${pendentesWpp>0?`<span style="position:absolute;top:-5px;right:-5px;min-width:16px;height:16px;padding:0 4px;border-radius:20px;background:var(--gold);color:#1a1509;font-size:9px;font-weight:800;display:flex;align-items:center;justify-content:center;">${pendentesWpp}</span>`:''}
        </button>
      </div>
      <div class="search-box" style="max-width:260px;">
        ${ICON.search}
        <input type="text" id="vendasBuscaInput" placeholder="Buscar cliente..." value="${escapeHtml(vendasBusca)}">
      </div>
    </div>

    ${pendentesWpp>0 && vendasFiltro!=='whatsapp' ? `
    <div class="banner" style="margin-bottom:16px;">
      ${ICON.whatsapp}
      <div>
        <div class="bt">${pendentesWpp} pedido${pendentesWpp===1?'':'s'} aguardando confirmação</div>
        <div class="bs">Pedido${pendentesWpp===1?' enviado':'s enviados'} pelo WhatsApp da loja. Confirme para registrar a venda e debitar o estoque, ou cancele para remover.</div>
      </div>
    </div>` : ''}

    ${list.length ? `
    <div class="table-wrap">
      <table>
        <thead>
          <tr><th>Cliente</th><th>Data</th><th>Tipo</th><th>Itens</th><th class="num">Total</th><th>Status</th><th></th></tr>
        </thead>
        <tbody>
          ${list.map(s=>{
            const isPendWpp = s.status==='aguardando_wpp';
            const qtdItens  = s.itens.reduce((n,i)=>n+i.qtd,0);
            return `
            <tr class="${isPendWpp?'venda-wpp-pendente':''}">
              <td style="font-weight:700;">
                ${escapeHtml(s.cliente)}
                ${isPendWpp?`<div style="font-size:10.5px;color:var(--gold-dim);font-weight:600;margin-top:2px;">${ICON.whatsapp.replace('viewBox','style="width:11px;height:11px;vertical-align:middle;fill:var(--gold-dim);" viewBox')} Via loja online</div>`:''}
              </td>
              <td>${dateBR(s.date)}</td>
              <td>${s.tipo==='vista'?'À vista':`A prazo (${s.parcelas.length}x)`}</td>
              <td>${qtdItens} peça${qtdItens===1?'':'s'}</td>
              <td class="num" style="font-weight:700; color:${isPendWpp?'var(--gold-dim)':'var(--gold-light)'};">${money(s.total)}</td>
              <td>${statusTagHtml(s.status)}</td>
              <td>
                <div class="row-actions">
                  ${isPendWpp ? `
                    <button class="btn btn-ghost btn-sm" data-confirmar="${s.id}" aria-label="Confirmar venda" title="Confirmar venda e debitar estoque" style="gap:5px; padding:6px 10px; font-size:11.5px; color:var(--success);">${ICON.spark} Confirmar</button>
                    <button class="icon-btn danger" data-cancelarv="${s.id}" aria-label="Cancelar pedido" title="Cancelar — sem afetar estoque">${ICON.trash}</button>
                  ` : `
                    <button class="icon-btn" data-view="${s.id}" aria-label="Ver detalhes">${ICON.eye}</button>
                    <button class="icon-btn danger" data-delv="${s.id}" aria-label="Excluir">${ICON.trash}</button>
                  `}
                </div>
              </td>
            </tr>`;
          }).join('')}
        </tbody>
      </table>
    </div>` : emptyState('Nenhuma venda encontrada', 'Registre a primeira venda ou ajuste os filtros acima.', ICON.vendas)}
  `;

  function chip(val,label){
    return `<button class="chip-tab ${vendasFiltro===val?'active':''}" data-filtro="${val}">${label}</button>`;
  }
}

function bindVendas(){
  document.getElementById('btnNovaVenda').addEventListener('click', openVendaModal);
  document.querySelectorAll('[data-filtro]').forEach(b=>b.addEventListener('click', ()=>{
    state.ui.vendasFiltro = b.dataset.filtro; render();
  }));
  const buscaInput = document.getElementById('vendasBuscaInput');
  buscaInput.addEventListener('input', ()=>{
    state.ui.vendasBusca = buscaInput.value; render();
    const el = document.getElementById('vendasBuscaInput');
    el.focus(); el.setSelectionRange(el.value.length, el.value.length);
  });
  document.querySelectorAll('[data-view]').forEach(b=>b.addEventListener('click', ()=>{
    openVendaDetalhe(state.sales.find(s=>s.id===b.dataset.view));
  }));
  document.querySelectorAll('[data-delv]').forEach(b=>b.addEventListener('click', ()=>{
    const s = state.sales.find(x=>x.id===b.dataset.delv);
    confirmModal(`Excluir a venda de <strong>${escapeHtml(s.cliente)}</strong> no valor de ${money(s.total)}? O estoque dos produtos será devolvido.`, async ()=>{
      s.itens.forEach(it=>{
        const prod = state.products.find(p=>p.id===it.productId);
        if(prod) prod.estoque += it.qtd;
      });
      state.sales = state.sales.filter(x=>x.id!==s.id);
      await Promise.all([persistSales(), persistProducts()]);
      toast('Venda excluída e estoque devolvido.', 'success');
      render();
    });
  }));

  /* ── Confirmar pedido WPP → vira venda normal e debita estoque ── */
  document.querySelectorAll('[data-confirmar]').forEach(b=>b.addEventListener('click', async ()=>{
    const s = state.sales.find(x=>x.id===b.dataset.confirmar);
    if(!s) return;
    confirmModal(
      `Confirmar o pedido de <strong>${escapeHtml(s.cliente)}</strong> (${money(s.total)})? O estoque será debitado e a venda ficará registrada como pendente de pagamento.`,
      async ()=>{
        /* Debita estoque */
        s.itens.forEach(it=>{
          const prod = state.products.find(p=>p.id===it.productId);
          if(prod) prod.estoque = Math.max(0, prod.estoque - it.qtd);
        });
        /* Remove marcação de origem e promove status */
        s.status  = (s.tipo==='vista') ? 'pago' : 'pendente';
        s.origem  = 'carrinho_wpp_confirmado';
        await Promise.all([persistSales(), persistProducts()]);
        toast('Venda confirmada e estoque debitado.', 'success');
        render();
      }
    );
  }));

  /* ── Cancelar pedido WPP → remove sem tocar no estoque ── */
  document.querySelectorAll('[data-cancelarv]').forEach(b=>b.addEventListener('click', ()=>{
    const s = state.sales.find(x=>x.id===b.dataset.cancelarv);
    if(!s) return;
    confirmModal(
      `Cancelar o pedido de <strong>${escapeHtml(s.cliente)}</strong>? Ele será removido sem afetar o estoque.`,
      async ()=>{
        state.sales = state.sales.filter(x=>x.id!==s.id);
        await persistSales();
        toast('Pedido cancelado.', 'info');
        render();
      }
    );
  }));
}

function openVendaModal(){
  const cart = [];
  let tipo = 'vista';
  let parcelasQtd = 2;
  let primeiraData = (function(){ const d=new Date(); d.setDate(d.getDate()+30); return d.toISOString().slice(0,10); })();

  const bodyHtml = `
    <div class="form-grid">
      <div class="field span2">
        <label for="vCliente">Nome da cliente</label>
        <input type="text" id="vCliente" placeholder="Ex: Marina Alves">
      </div>
      <div class="field span2">
        <label for="vTelefone">Telefone / WhatsApp <span class="hint">opcional</span></label>
        <input type="tel" id="vTelefone" placeholder="(45) 99999-9999">
      </div>
    </div>

    <div style="margin-top:18px;">
      <label style="font-size:11.5px; color:var(--text-muted); font-weight:700;">Adicionar produto</label>
      <div class="form-grid" style="margin-top:8px;">
        <div class="field span2">
          <select id="vProduto">
            <option value="">Selecione um produto...</option>
            ${state.products.filter(p=>p.estoque>0).map(p=>`<option value="${p.id}">${escapeHtml(p.nome)} — ${money(p.preco)} (${p.estoque} un.)</option>`).join('')}
          </select>
        </div>
        <div class="field">
          <select id="vTamanho"><option value="">Tamanho</option></select>
        </div>
        <div class="field">
          <input type="number" id="vQtd" min="1" value="1" placeholder="Qtd.">
        </div>
      </div>
      <button type="button" class="btn btn-ghost btn-sm" id="vAddItem" style="margin-top:10px;">${ICON.plus} Adicionar à venda</button>
    </div>

    <div class="cart-list" id="cartList"><div style="font-size:12px; color:var(--text-faint);">Nenhum item adicionado ainda.</div></div>
    <div class="cart-total-row"><span class="lbl">Total</span><span id="cartTotal">R$ 0,00</span></div>

    <div style="margin-top:20px;">
      <label style="font-size:11.5px; color:var(--text-muted); font-weight:700;">Forma de pagamento</label>
      <div class="radio-cards" style="margin-top:8px;">
        <div class="radio-card active" id="cardVista">
          <div class="rh"><span class="dotc"></span> À vista</div>
          <p>Pagamento completo no ato da venda.</p>
        </div>
        <div class="radio-card" id="cardPrazo">
          <div class="rh"><span class="dotc"></span> A prazo</div>
          <p>Parcelado, com datas de vencimento.</p>
        </div>
      </div>
    </div>

    <div id="prazoFields" style="display:none; margin-top:14px;">
      <div class="form-grid">
        <div class="field">
          <label for="vParcelas">Número de parcelas</label>
          <select id="vParcelas">
            ${[2,3,4,5,6,8,10,12].map(n=>`<option value="${n}">${n}x</option>`)}
          </select>
        </div>
        <div class="field">
          <label for="vPrimeiraData">1ª data de vencimento</label>
          <input type="date" id="vPrimeiraData" value="${primeiraData}">
        </div>
      </div>
      <div id="previewParcelas" class="installments-grid"></div>
    </div>
  `;
  const footHtml = `
    <button class="btn btn-line" id="vCancel">Cancelar</button>
    <button class="btn btn-gold" id="vSave">Registrar venda</button>
  `;

  openModal({
    title:'Registrar venda', wide:true, bodyHtml, footHtml,
    onMount:(root)=>{
      const produtoSelect = root.querySelector('#vProduto');
      const tamanhoSelect = root.querySelector('#vTamanho');

      produtoSelect.addEventListener('change', ()=>{
        const prod = state.products.find(p=>p.id===produtoSelect.value);
        tamanhoSelect.innerHTML = '<option value="">Tamanho</option>' +
          (prod ? (prod.sizes||[]).map(s=>`<option value="${s}">${s}</option>`).join('') : '');
      });

      root.querySelector('#vAddItem').addEventListener('click', ()=>{
        const prod = state.products.find(p=>p.id===produtoSelect.value);
        const tamanho = tamanhoSelect.value;
        const qtd = parseInt(root.querySelector('#vQtd').value,10) || 1;
        if(!prod){ toast('Selecione um produto.', 'danger'); return; }
        if(prod.sizes && prod.sizes.length && !tamanho){ toast('Selecione o tamanho.', 'danger'); return; }
        if(qtd<1){ toast('Quantidade inválida.', 'danger'); return; }
        if(qtd>prod.estoque){ toast(`Estoque insuficiente (disponível: ${prod.estoque}).`, 'danger'); return; }

        cart.push({productId:prod.id, nome:prod.nome, tamanho:tamanho||'Único', qtd, preco:prod.preco});
        renderCart();
        produtoSelect.value=''; tamanhoSelect.innerHTML='<option value="">Tamanho</option>'; root.querySelector('#vQtd').value=1;
      });

      function renderCart(){
        const listEl = root.querySelector('#cartList');
        if(!cart.length){
          listEl.innerHTML = '<div style="font-size:12px; color:var(--text-faint);">Nenhum item adicionado ainda.</div>';
        }else{
          listEl.innerHTML = cart.map((it,idx)=>`
            <div class="cart-item">
              <div>
                <div class="ci-name">${escapeHtml(it.nome)}</div>
                <div class="ci-meta">Tam. ${escapeHtml(it.tamanho)} · ${it.qtd}x ${money(it.preco)}</div>
              </div>
              <div class="ci-amt">${money(it.preco*it.qtd)}</div>
              <button type="button" class="icon-btn danger" data-rm="${idx}" style="width:26px;height:26px;">${ICON.close}</button>
            </div>`).join('');
          listEl.querySelectorAll('[data-rm]').forEach(b=>b.addEventListener('click', ()=>{
            cart.splice(parseInt(b.dataset.rm,10),1); renderCart();
          }));
        }
        const total = cart.reduce((s,i)=>s+i.preco*i.qtd,0);
        root.querySelector('#cartTotal').textContent = money(total);
        renderParcelasPreview(total);
      }

      const cardVista = root.querySelector('#cardVista');
      const cardPrazo = root.querySelector('#cardPrazo');
      const prazoFields = root.querySelector('#prazoFields');
      cardVista.addEventListener('click', ()=>{ tipo='vista'; cardVista.classList.add('active'); cardPrazo.classList.remove('active'); prazoFields.style.display='none'; });
      cardPrazo.addEventListener('click', ()=>{ tipo='prazo'; cardPrazo.classList.add('active'); cardVista.classList.remove('active'); prazoFields.style.display='block'; renderParcelasPreview(cart.reduce((s,i)=>s+i.preco*i.qtd,0)); });

      const parcelasSelect = root.querySelector('#vParcelas');
      const dataInput = root.querySelector('#vPrimeiraData');
      parcelasSelect.addEventListener('change', ()=>{ parcelasQtd = parseInt(parcelasSelect.value,10); renderParcelasPreview(cart.reduce((s,i)=>s+i.preco*i.qtd,0)); });
      dataInput.addEventListener('change', ()=>{ primeiraData = dataInput.value; renderParcelasPreview(cart.reduce((s,i)=>s+i.preco*i.qtd,0)); });

      function renderParcelasPreview(total){
        const el = root.querySelector('#previewParcelas');
        if(tipo!=='prazo' || !total){ el.innerHTML=''; return; }
        const n = parcelasQtd;
        const valor = Math.round((total/n)*100)/100;
        let html='';
        for(let i=1;i<=n;i++){
          const d = new Date(primeiraData+'T00:00:00'); d.setMonth(d.getMonth()+(i-1));
          html += `<div class="inst-chip"><div class="in"><span>Parcela ${i}</span><span>${dateBR(d.toISOString().slice(0,10))}</span></div><div class="iv">${money(valor)}</div></div>`;
        }
        el.innerHTML = html;
      }

      root.querySelector('#vCancel').addEventListener('click', closeModal);
      const vSaveBtn = root.querySelector('#vSave');
      const vSaveOriginal = vSaveBtn.innerHTML;
      const setVendaLoading = (on)=>{
        vSaveBtn.disabled = on;
        vSaveBtn.innerHTML = on ? 'Registrando…' : vSaveOriginal;
      };

      root.querySelector('#vSave').addEventListener('click', async ()=>{
        const cliente = root.querySelector('#vCliente').value.trim();
        if(!cliente){ toast('Informe o nome da cliente.', 'danger'); return; }
        if(!cart.length){ toast('Adicione ao menos um produto à venda.', 'danger'); return; }

        setVendaLoading(true);

        const telefone = root.querySelector('#vTelefone').value.trim();
        const sale = mkSale({
          cliente, telefone, date: todayISO(), tipo, itens: cart,
          parcelasQtd: tipo==='prazo'?parcelasQtd:undefined,
          primeiraData: tipo==='prazo'?primeiraData:undefined
        });

        // Deduz estoque em memória
        const estoqueAnterior = {};
        cart.forEach(it=>{
          const prod = state.products.find(p=>p.id===it.productId);
          if(prod){
            estoqueAnterior[prod.id] = prod.estoque;
            prod.estoque = Math.max(0, prod.estoque - it.qtd);
          }
        });

        state.sales.push(sale);

        // Persiste os dois em paralelo e aguarda ambos concluírem
        await Promise.all([persistSales(), persistProducts()]);

        setVendaLoading(false);
        toast('Venda registrada com sucesso.', 'success');
        closeModal();
        render();
      });
    }
  });
}

function openVendaDetalhe(sale){
  const bodyHtml = `
    <div style="display:flex; justify-content:space-between; margin-bottom:16px;">
      <div>
        <div style="font-family:var(--font-display); font-size:17px;">${escapeHtml(sale.cliente)}</div>
        <div style="font-size:12px; color:var(--text-faint); margin-top:3px;">${sale.telefone?escapeHtml(sale.telefone)+' · ':''}${dateBR(sale.date)}</div>
      </div>
      <div style="text-align:right;">
        ${statusTagHtml(sale.status)}
        <div style="font-family:var(--font-display); font-size:19px; color:var(--gold-light); margin-top:6px;">${money(sale.total)}</div>
      </div>
    </div>

    <div class="panel" style="padding:14px 16px;">
      <div style="font-size:11px; text-transform:uppercase; letter-spacing:.07em; color:var(--text-faint); margin-bottom:10px;">Itens</div>
      <div class="mini-list">
        ${sale.itens.map(it=>`
          <div class="mini-row">
            <div><div class="name">${escapeHtml(it.nome)}</div><div class="sub">Tam. ${escapeHtml(it.tamanho)} · ${it.qtd}x ${money(it.preco)}</div></div>
            <span class="amt">${money(it.preco*it.qtd)}</span>
          </div>`).join('')}
      </div>
    </div>

    ${sale.tipo==='prazo' ? `
    <div style="margin-top:16px;">
      <div style="font-size:11px; text-transform:uppercase; letter-spacing:.07em; color:var(--text-faint); margin-bottom:10px;">Parcelas</div>
      <div class="installments-grid" id="parcelasDetalhe">
        ${sale.parcelas.map((p,idx)=>`
          <div class="inst-chip ${p.status==='pago'?'paid':''}">
            <div class="in"><span>Parcela ${p.num}</span><span>${dateBR(p.vencimento)}</span></div>
            <div class="iv">${money(p.valor)}</div>
            <label><input type="checkbox" data-pidx="${idx}" ${p.status==='pago'?'checked':''}> Paga</label>
          </div>`).join('')}
      </div>
    </div>` : ''}
  `;
  openModal({
    title:'Detalhes da venda', wide:true, bodyHtml,
    footHtml:`<button class="btn btn-gold" id="vdClose">Fechar</button>`,
    onMount:(root)=>{
      root.querySelector('#vdClose').addEventListener('click', closeModal);
      root.querySelectorAll('[data-pidx]').forEach(cb=>{
        cb.addEventListener('change', ()=>{
          const idx = parseInt(cb.dataset.pidx,10);
          sale.parcelas[idx].status = cb.checked ? 'pago' : 'pendente';
          recalcSaleStatus(sale);
          persistSales();
          closeModal();
          openVendaDetalhe(sale);
          render();
        });
      });
    }
  });
}
