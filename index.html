async function uploadFotoProduto(file, produtoId){
  if(!sb) throw new Error('Supabase não configurado');
  const ext = file.name.split('.').pop().toLowerCase();
  const path = `${produtoId}.${ext}`;
  // Remove foto antiga se existir
  await sb.storage.from('produtos').remove([path]).catch(()=>{});
  const { error } = await sb.storage.from('produtos').upload(path, file, {
    upsert: true,
    contentType: file.type
  });
  if(error) throw error;
  const { data } = sb.storage.from('produtos').getPublicUrl(path);
  return data.publicUrl;
}

async function removerFotoProduto(fotoUrl){
  if(!sb || !fotoUrl) return;
  try{
    // Extrai o path do final da URL pública
    const parts = fotoUrl.split('/produtos/');
    if(parts[1]) await sb.storage.from('produtos').remove([parts[1]]);
  }catch(e){ console.warn('[Storage] falha ao remover foto:', e); }
}

function openProdutoModal(produto){
  const editing = !!produto;
  const draft = produto ? {...produto, sizes:[...(produto.sizes||[])]} : {
    id:null, nome:'', categoria:CATEGORIAS[0], sizes:[], cor:'', preco:'', custo:'', estoque:'', sku:'', fotoUrl:''
  };

  // Estado local da foto no modal
  let fotoState = { file: null, url: draft.fotoUrl || '', removida: false };

  const fotoPreviewHtml = draft.fotoUrl
    ? `<img src="${draft.fotoUrl}" alt="foto"><button class="foto-remove" id="fotoRemove" title="Remover foto">✕</button>`
    : `<span id="fotoGlyph">${escapeHtml((draft.nome||'?').trim().charAt(0).toUpperCase()||'?')}</span>`;

  const bodyHtml = `
    <div class="form-grid">
      <div class="field span2">
        <label>Foto do produto</label>
        <div class="foto-upload-area">
          <div class="foto-preview" id="fotoPreview">${fotoPreviewHtml}</div>
          <div class="foto-upload-actions">
            <label class="foto-upload-label" id="fotoUploadLabel">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="17 8 12 3 7 8"/><line x1="12" y1="3" x2="12" y2="15"/></svg>
              Escolher foto
              <input type="file" id="fotoInput" accept="image/jpeg,image/png,image/webp" style="display:none;">
            </label>
            <span class="foto-upload-hint">JPG, PNG ou WebP · máx. 5 MB<br>A foto será salva no Supabase Storage.</span>
            <span class="foto-upload-status" id="fotoStatus"></span>
          </div>
        </div>
      </div>
      <div class="field span2">
        <label for="fNome">Nome do produto</label>
        <input type="text" id="fNome" value="${escapeHtml(draft.nome)}" placeholder="Ex: Vestido Midi Essência">
      </div>
      <div class="field">
        <label for="fCategoria">Categoria</label>
        <select id="fCategoria">
          ${CATEGORIAS.map(c=>`<option value="${c}" ${draft.categoria===c?'selected':''}>${c}</option>`).join('')}
        </select>
      </div>
      <div class="field">
        <label for="fSku">SKU / código</label>
        <input type="text" id="fSku" value="${escapeHtml(draft.sku)}" placeholder="Ex: VM-001">
      </div>
      <div class="field">
        <label for="fCor">Cor</label>
        <input type="text" id="fCor" value="${escapeHtml(draft.cor)}" placeholder="Ex: Preto, Dourado...">
      </div>
      <div class="field">
        <label for="fEstoque">Estoque (un.)</label>
        <input type="number" id="fEstoque" min="0" value="${draft.estoque}">
      </div>
      <div class="field">
        <label for="fPreco">Preço de venda (R$)</label>
        <input type="number" id="fPreco" min="0" step="0.01" value="${draft.preco}">
      </div>
      <div class="field">
        <label for="fCusto">Preço de custo (R$) <span class="hint">opcional</span></label>
        <input type="number" id="fCusto" min="0" step="0.01" value="${draft.custo!=null?draft.custo:''}">
      </div>
      <div class="field span2">
        <label>Tamanhos disponíveis</label>
        <div class="size-picker" id="sizePicker">
          ${TAMANHOS_PADRAO.map(s=>`<div class="size-opt ${draft.sizes.includes(s)?'selected':''}" data-size="${s}">${s}</div>`).join('')}
        </div>
        <div style="display:flex; gap:8px; margin-top:4px;">
          <input type="text" id="fCustomSize" placeholder="Tamanho numérico (ex: 38)" style="max-width:220px;">
          <button type="button" class="btn btn-line btn-sm" id="addCustomSize">Adicionar</button>
        </div>
      </div>
    </div>
  `;
  const footHtml = `
    <button class="btn btn-line" id="pCancel">Cancelar</button>
    <button class="btn btn-gold" id="pSave">${editing?'Salvar alterações':'Cadastrar produto'}</button>
  `;

  openModal({
    title: editing ? 'Editar produto' : 'Novo produto',
    bodyHtml, footHtml, wide: true,
    onMount:(root)=>{
      // ── Foto: escolher arquivo
      const fotoInput = root.querySelector('#fotoInput');
      const fotoPreview = root.querySelector('#fotoPreview');
      const fotoStatus = root.querySelector('#fotoStatus');

      function atualizarPreview(){
        if(fotoState.url){
          fotoPreview.innerHTML = `<img src="${fotoState.url}" alt="foto"><button class="foto-remove" id="fotoRemove" title="Remover foto">✕</button>`;
          root.querySelector('#fotoRemove').addEventListener('click', removerFoto);
        } else {
          const inicial = root.querySelector('#fNome').value.trim().charAt(0).toUpperCase() || '?';
          fotoPreview.innerHTML = `<span>${escapeHtml(inicial)}</span>`;
        }
      }

      function removerFoto(){
        fotoState = { file: null, url: '', removida: true };
        fotoStatus.textContent = '';
        fotoStatus.className = 'foto-upload-status';
        atualizarPreview();
      }

      if(root.querySelector('#fotoRemove')){
        root.querySelector('#fotoRemove').addEventListener('click', removerFoto);
      }

      fotoInput.addEventListener('change', ()=>{
        const file = fotoInput.files[0];
        if(!file) return;
        if(file.size > 5 * 1024 * 1024){
          toast('A foto deve ter no máximo 5 MB.', 'danger');
          return;
        }
        fotoState.file = file;
        fotoState.removida = false;
        // Preview local imediato
        const reader = new FileReader();
        reader.onload = (e)=>{
          fotoState.url = e.target.result;
          atualizarPreview();
          fotoStatus.textContent = `${file.name} selecionada — será enviada ao salvar`;
          fotoStatus.className = 'foto-upload-status';
        };
        reader.readAsDataURL(file);
      });

      // ── Tamanhos
      const picker = root.querySelector('#sizePicker');
      picker.querySelectorAll('.size-opt').forEach(opt=>{
        opt.addEventListener('click', ()=>{
          const s = opt.dataset.size;
          if(draft.sizes.includes(s)){
            draft.sizes = draft.sizes.filter(x=>x!==s);
            opt.classList.remove('selected');
          }else{
            draft.sizes.push(s);
            opt.classList.add('selected');
          }
        });
      });
      root.querySelector('#addCustomSize').addEventListener('click', ()=>{
        const input = root.querySelector('#fCustomSize');
        const v = input.value.trim();
        if(!v) return;
        if(!draft.sizes.includes(v)){
          draft.sizes.push(v);
          const el = document.createElement('div');
          el.className = 'size-opt selected';
          el.dataset.size = v;
          el.textContent = v;
          el.addEventListener('click', ()=>{
            draft.sizes = draft.sizes.filter(x=>x!==v);
            el.remove();
          });
          picker.appendChild(el);
        }
        input.value='';
      });

      root.querySelector('#pCancel').addEventListener('click', closeModal);
      const pSaveBtn = root.querySelector('#pSave');
      const pSaveOriginal = pSaveBtn.innerHTML;
      const setProdLoading = (on, msg)=>{
        pSaveBtn.disabled = on;
        pSaveBtn.innerHTML = on ? (msg||'Salvando…') : pSaveOriginal;
      };

      root.querySelector('#pSave').addEventListener('click', async ()=>{
        const nome = root.querySelector('#fNome').value.trim();
        const preco = parseFloat(root.querySelector('#fPreco').value);
        const estoque = parseInt(root.querySelector('#fEstoque').value,10);

        if(!nome){ toast('Informe o nome do produto.', 'danger'); return; }
        if(isNaN(preco) || preco<0){ toast('Informe um preço válido.', 'danger'); return; }
        if(isNaN(estoque) || estoque<0){ toast('Informe uma quantidade de estoque válida.', 'danger'); return; }

        const prodId = draft.id || uid('p');
        let fotoUrl = draft.fotoUrl || '';

        setProdLoading(true, 'Salvando…');

        // Upload da foto se houver arquivo novo
        if(fotoState.file){
          try{
            fotoStatus.textContent = 'Enviando foto…';
            fotoStatus.className = 'foto-upload-status uploading';
            setProdLoading(true, 'Enviando foto…');
            fotoUrl = await uploadFotoProduto(fotoState.file, prodId);
            fotoStatus.textContent = 'Foto enviada!';
            fotoStatus.className = 'foto-upload-status done';
          }catch(err){
            fotoStatus.textContent = 'Erro ao enviar foto: ' + (err.message||err);
            fotoStatus.className = 'foto-upload-status error';
            setProdLoading(false);
            toast('Erro ao enviar a foto. Verifique o bucket no Supabase.', 'danger');
            return;
          }
        } else if(fotoState.removida){
          // Remover foto do storage
          await removerFotoProduto(draft.fotoUrl);
          fotoUrl = '';
        }

        const payload = {
          id: prodId,
          nome,
          categoria: root.querySelector('#fCategoria').value,
          sku: root.querySelector('#fSku').value.trim(),
          cor: root.querySelector('#fCor').value.trim(),
          sizes: draft.sizes,
          preco,
          custo: root.querySelector('#fCusto').value ? parseFloat(root.querySelector('#fCusto').value) : null,
          estoque,
          fotoUrl
        };

        if(editing){
          const idx = state.products.findIndex(x=>x.id===draft.id);
          state.products[idx] = payload;
        }else{
          state.products.push(payload);
        }

        await persistProducts();

        setProdLoading(false);
        toast(editing ? 'Produto atualizado.' : 'Produto cadastrado.', 'success');
        closeModal();
        render();
      });
    }
  });
}

function viewVendas(){
  const { vendasFiltro, vendasBusca } = state.ui;
  let list = state.sales.slice();

  if(vendasFiltro==='prazo') list = list.filter(s=>s.tipo==='prazo');
  if(vendasFiltro==='pendente') list = list.filter(s=>s.status==='pendente'||s.status==='parcial');

    list = list.filter(s=>s.cliente.toLowerCase().includes(q));

  document.querySelectorAll('[data-delv]').forEach(b=>b.addEventListener('click', ()=>{

    confirmModal(`Excluir a venda de <strong>${escapeHtml(s.cliente)}</strong> no valor de ${money(s.total)}? O estoque dos produtos será devolvido.`, async ()=>{

      render();

        if(qtd<1){ toast('Quantidade inválida.', 'danger'); return; }
        if(qtd>prod.estoque){ toast(`Estoque insuficiente (disponível: ${prod.estoque}).`, 'danger'); return; }

        cart.push({productId:prod.id, nome:prod.nome, tamanho:tamanho||'Único', qtd, preco:prod.preco});
        renderCart();
        produtoSelect.value=''; tamanhoSelect.innerHTML='<option value="">Tamanho</option>'; root.querySelector('#vQtd').value=1;
      });

      function renderCart(){
        const listEl = root.querySelector('#cartList');
        if(!cart.length){
          listEl.innerHTML = '<div style="font-size:12px; color:var(--text-faint);">Nenhum item adicionado ainda.</div>';
        }else{
          listEl.innerHTML = cart.map((it,idx)=>`
            <div class="cart-item">
              <div>
                <div class="ci-name">${escapeHtml(it.nome)}</div>
                <div class="ci-meta">Tam. ${escapeHtml(it.tamanho)} · ${it.qtd}x ${money(it.preco)}</div>
              </div>
              <div class="ci-amt">${money(it.preco*it.qtd)}</div>
              <button type="button" class="icon-btn danger" data-rm="${idx}" style="width:26px;height:26px;">${ICON.close}</button>
            </div>`).join('');
          listEl.querySelectorAll('[data-rm]').forEach(b=>b.addEventListener('click', ()=>{
            cart.splice(parseInt(b.dataset.rm,10),1); renderCart();
          }));
        }
        const total = cart.reduce((s,i)=>s+i.preco*i.qtd,0);
        root.querySelector('#cartTotal').textContent = money(total);
        renderParcelasPreview(total);
      }

      const cardVista = root.querySelector('#cardVista');
      const cardPrazo = root.querySelector('#cardPrazo');
      const prazoFields = root.querySelector('#prazoFields');
      cardVista.addEventListener('click', ()=>{ tipo='vista'; cardVista.classList.add('active'); cardPrazo.classList.remove('active'); prazoFields.style.display='none'; });
      cardPrazo.addEventListener('click', ()=>{ tipo='prazo'; cardPrazo.classList.add('active'); cardVista.classList.remove('active'); prazoFields.style.display='block'; renderParcelasPreview(cart.reduce((s,i)=>s+i.preco*i.qtd,0)); });

      const parcelasSelect = root.querySelector('#vParcelas');
      const dataInput = root.querySelector('#vPrimeiraData');
      parcelasSelect.addEventListener('change', ()=>{ parcelasQtd = parseInt(parcelasSelect.value,10); renderParcelasPreview(cart.reduce((s,i)=>s+i.preco*i.qtd,0)); });
      dataInput.addEventListener('change', ()=>{ primeiraData = dataInput.value; renderParcelasPreview(cart.reduce((s,i)=>s+i.preco*i.qtd,0)); });

      function renderParcelasPreview(total){
        const el = root.querySelector('#previewParcelas');
        if(tipo!=='prazo' || !total){ el.innerHTML=''; return; }
        const n = parcelasQtd;
        const valor = Math.round((total/n)*100)/100;
        let html='';
        for(let i=1;i<=n;i++){
          const d = new Date(primeiraData+'T00:00:00'); d.setMonth(d.getMonth()+(i-1));
          html += `<div class="inst-chip"><div class="in"><span>Parcela ${i}</span><span>${dateBR(d.toISOString().slice(0,10))}</span></div><div class="iv">${money(valor)}</div></div>`;
        }
        el.innerHTML = html;
      }

      root.querySelector('#vCancel').addEventListener('click', closeModal);
      const vSaveBtn = root.querySelector('#vSave');
      const vSaveOriginal = vSaveBtn.innerHTML;
      const setVendaLoading = (on)=>{
        vSaveBtn.disabled = on;
        vSaveBtn.innerHTML = on ? 'Registrando…' : vSaveOriginal;
      };

      root.querySelector('#vSave').addEventListener('click', async ()=>{
        const cliente = root.querySelector('#vCliente').value.trim();
        if(!cliente){ toast('Informe o nome da cliente.', 'danger'); return; }
        if(!cart.length){ toast('Adicione ao menos um produto à venda.', 'danger'); return; }

        setVendaLoading(true);

        const telefone = root.querySelector('#vTelefone').value.trim();
        const sale = mkSale({
          cliente, telefone, date: todayISO(), tipo, itens: cart,
          parcelasQtd: tipo==='prazo'?parcelasQtd:undefined,
          primeiraData: tipo==='prazo'?primeiraData:undefined
        });

        // Deduz estoque em memória
        const estoqueAnterior = {};
        cart.forEach(it=>{
          const prod = state.products.find(p=>p.id===it.productId);
          if(prod){
            estoqueAnterior[prod.id] = prod.estoque;
            prod.estoque = Math.max(0, prod.estoque - it.qtd);
          }
        });

        state.sales.push(sale);

        // Persiste os dois em paralelo e aguarda ambos concluírem
        await Promise.all([persistSales(), persistProducts()]);

        setVendaLoading(false);
        toast('Venda registrada com sucesso.', 'success');
        closeModal();
        render();
      });
    }
  });
}

/* Status "efetivo" para exibição: se ainda em aberto mas o prazo já
   passou, mostra como atrasado sem precisar de um job separado. */
function condicionalStatusEfetivo(c){
  if(c.status==='em_aberto' && c.prazo && c.prazo < todayISO()) return 'atrasado';
  return c.status;
}
function condicionalStatusTag(s){
  if(s==='em_aberto') return `<span class="tag tag-gold">Em aberto</span>`;
  if(s==='atrasado') return `<span class="tag tag-danger">Atrasado</span>`;
  if(s==='vendido') return `<span class="tag tag-success">Vendido</span>`;
  return `<span class="tag tag-muted">Devolvido</span>`;
}
function condicionalPecasLabel(c){
  const qtdTotal = (c.itens||[]).reduce((n,i)=>n+i.qtd,0);
  const nomes = (c.itens||[]).map(i=>i.nome).join(', ');
  return `${qtdTotal} peça${qtdTotal===1?'':'s'}${nomes?` (${nomes})`:''}`;
}

function viewCondicionais(){
  const { condicionaisFiltro, condicionaisBusca } = state.ui;
  let list = state.condicionais.slice();
  if(condicionaisFiltro!=='todas'){
    list = list.filter(c=>condicionalStatusEfetivo(c)===condicionaisFiltro);
  }
  if(condicionaisBusca.trim()){
    const q = condicionaisBusca.trim().toLowerCase();
    list = list.filter(c=>c.cliente.toLowerCase().includes(q));
  }
  list.sort((a,b)=> (a.prazo||'').localeCompare(b.prazo||''));

  function chip(val,label){
    return `<button class="chip-tab ${condicionaisFiltro===val?'active':''}" data-cfiltro="${val}">${label}</button>`;
  }

  return `
    <div class="section-head">
      <div>
        <h2>Condicionais</h2>
        <p>${list.length} condicional${list.length===1?'':'is'} · controle de peças enviadas para avaliação da cliente</p>
      </div>
      <button class="btn btn-gold" id="btnNovaCondicional">${ICON.plus} Nova condicional</button>
    </div>

    <div class="toolbar">
      <div class="chip-tabs">
        ${chip('todas','Todas')}${chip('em_aberto','Em aberto')}${chip('atrasado','Atrasadas')}${chip('devolvido','Devolvidas')}${chip('vendido','Vendidas')}
      </div>
      <div class="search-box" style="max-width:260px;">
        ${ICON.search}
        <input type="text" id="condicionaisBuscaInput" placeholder="Buscar cliente..." value="${escapeHtml(condicionaisBusca)}">
      </div>
    </div>

    ${list.length ? `
    <div class="table-wrap">
      <table>
        <thead>
          <tr><th>Cliente</th><th>Peças</th><th>Saída</th><th>Prazo de devolução</th><th>Status</th><th></th></tr>
        </thead>
        <tbody>
          ${list.map(c=>`
            <tr>
              <td style="font-weight:700;">${escapeHtml(c.cliente)}</td>
              <td>${escapeHtml(condicionalPecasLabel(c))}</td>
              <td>${dateBR(c.saida)}</td>
              <td>${dateBR(c.prazo)}</td>
              <td>${condicionalStatusTag(condicionalStatusEfetivo(c))}</td>
              <td>
                <div class="row-actions">
                  <button class="icon-btn" data-cview="${c.id}" aria-label="Ver detalhes">${ICON.eye}</button>
                  <button class="icon-btn danger" data-cdel="${c.id}" aria-label="Excluir">${ICON.trash}</button>
                </div>
              </td>
            </tr>`).join('')}
        </tbody>
      </table>
    </div>` : emptyState('Nenhuma condicional encontrada', 'Registre uma nova condicional ou ajuste os filtros acima.', ICON.condicionais)}
  `;
}

function bindCondicionais(){
  document.getElementById('btnNovaCondicional').addEventListener('click', openCondicionalModal);
  document.querySelectorAll('[data-cfiltro]').forEach(b=>b.addEventListener('click', ()=>{
    state.ui.condicionaisFiltro = b.dataset.cfiltro; render();
  }));
  const buscaInput = document.getElementById('condicionaisBuscaInput');
  buscaInput.addEventListener('input', ()=>{
    state.ui.condicionaisBusca = buscaInput.value; render();
    const el = document.getElementById('condicionaisBuscaInput');
    el.focus(); el.setSelectionRange(el.value.length, el.value.length);
  });
  document.querySelectorAll('[data-cview]').forEach(b=>b.addEventListener('click', ()=>{
    openCondicionalDetalhe(state.condicionais.find(c=>c.id===b.dataset.cview));
  }));
  document.querySelectorAll('[data-cdel]').forEach(b=>b.addEventListener('click', ()=>{
    const c = state.condicionais.find(x=>x.id===b.dataset.cdel);
    const aindaAberta = condicionalStatusEfetivo(c)==='em_aberto' || condicionalStatusEfetivo(c)==='atrasado';
    confirmModal(`Excluir a condicional de <strong>${escapeHtml(c.cliente)}</strong>?${aindaAberta ? ' As peças ainda em aberto terão o estoque devolvido.' : ''}`, async ()=>{
      if(aindaAberta){
        (c.itens||[]).forEach(it=>{
          const prod = state.products.find(p=>p.id===it.productId);
          if(prod) prod.estoque += it.qtd;
        });
        await persistProducts();
      }
      state.condicionais = state.condicionais.filter(x=>x.id!==c.id);
      await persistCondicionais();
      toast('Condicional excluída.', 'success');
      render();
    });
  }));
}

function openCondicionalModal(){
  const itens = [];
  const hoje = todayISO();
  const prazoPadrao = (function(){ const d=new Date(); d.setDate(d.getDate()+3); return d.toISOString().slice(0,10); })();

  const bodyHtml = `
    <div class="form-grid">
      <div class="field span2">
        <label for="ncCliente">Nome da cliente</label>
        <input type="text" id="ncCliente" placeholder="Ex: Larissa Fontoura">
      </div>
      <div class="field span2">
        <label for="ncTelefone">Telefone / WhatsApp <span class="hint">opcional</span></label>
        <input type="tel" id="ncTelefone" placeholder="(45) 99999-9999">
      </div>
    </div>

    <div style="margin-top:18px;">
      <label style="font-size:11.5px; color:var(--text-muted); font-weight:700;">Peças enviadas</label>
      <div class="form-grid" style="margin-top:8px;">
        <div class="field span2">
          <select id="ncProduto">
            <option value="">Selecione um produto...</option>
            ${state.products.filter(p=>p.estoque>0).map(p=>`<option value="${p.id}">${escapeHtml(p.nome)} (${p.estoque} un.)</option>`).join('')}
          </select>
        </div>
        <div class="field">
          <select id="ncTamanho"><option value="">Tamanho</option></select>
        </div>
        <div class="field">
          <input type="number" id="ncQtd" min="1" value="1" placeholder="Qtd.">
        </div>
      </div>
      <button type="button" class="btn btn-ghost btn-sm" id="ncAddItem" style="margin-top:10px;">${ICON.plus} Adicionar peça</button>
    </div>

    <div class="cart-list" id="condItensList"><div style="font-size:12px; color:var(--text-faint);">Nenhuma peça adicionada ainda.</div></div>

    <div class="form-grid" style="margin-top:18px;">
      <div class="field">
        <label for="ncSaida">Data de saída</label>
        <input type="date" id="ncSaida" value="${hoje}">
      </div>
      <div class="field">
        <label for="ncPrazo">Prazo de devolução</label>
        <input type="date" id="ncPrazo" value="${prazoPadrao}">
      </div>
      <div class="field span2">
        <label for="ncObs">Observação <span class="hint">opcional</span></label>
        <input type="text" id="ncObs" placeholder="Ex: avisar por WhatsApp um dia antes">
      </div>
    </div>
  `;
  const footHtml = `<button class="btn btn-line" id="ncCancel">Cancelar</button><button class="btn btn-gold" id="ncSave">Salvar condicional</button>`;

  openModal({
    title:'Nova condicional', wide:true, bodyHtml, footHtml,
    onMount:(root)=>{
      const produtoSelect = root.querySelector('#ncProduto');
      const tamanhoSelect = root.querySelector('#ncTamanho');

      produtoSelect.addEventListener('change', ()=>{
        const prod = state.products.find(p=>p.id===produtoSelect.value);
        tamanhoSelect.innerHTML = '<option value="">Tamanho</option>' +
          (prod ? (prod.sizes||[]).map(s=>`<option value="${s}">${s}</option>`).join('') : '');
      });

      function renderItens(){
        const listEl = root.querySelector('#condItensList');
        if(!itens.length){
          listEl.innerHTML = '<div style="font-size:12px; color:var(--text-faint);">Nenhuma peça adicionada ainda.</div>';
        }else{
          listEl.innerHTML = itens.map((it,idx)=>`
            <div class="cart-item">
              <div>
                <div class="ci-name">${escapeHtml(it.nome)}</div>
                <div class="ci-meta">Tam. ${escapeHtml(it.tamanho)} · ${it.qtd}x</div>
              </div>
              <button type="button" class="icon-btn danger" data-rm="${idx}" style="width:26px;height:26px;">${ICON.close}</button>
            </div>`).join('');
          listEl.querySelectorAll('[data-rm]').forEach(b=>b.addEventListener('click', ()=>{
            itens.splice(parseInt(b.dataset.rm,10),1); renderItens();
          }));
        }
      }

      root.querySelector('#ncAddItem').addEventListener('click', ()=>{
        const prod = state.products.find(p=>p.id===produtoSelect.value);
        const tamanho = tamanhoSelect.value;
        const qtd = parseInt(root.querySelector('#ncQtd').value,10) || 1;
        if(!prod){ toast('Selecione um produto.', 'danger'); return; }
        if(prod.sizes && prod.sizes.length && !tamanho){ toast('Selecione o tamanho.', 'danger'); return; }
        if(qtd<1){ toast('Quantidade inválida.', 'danger'); return; }
        if(qtd>prod.estoque){ toast(`Estoque insuficiente (disponível: ${prod.estoque}).`, 'danger'); return; }

        itens.push({productId:prod.id, nome:prod.nome, tamanho:tamanho||'Único', qtd});
        renderItens();
        produtoSelect.value=''; tamanhoSelect.innerHTML='<option value="">Tamanho</option>'; root.querySelector('#ncQtd').value=1;
      });

      root.querySelector('#ncCancel').addEventListener('click', closeModal);
      const saveBtn = root.querySelector('#ncSave');
      const saveBtnOriginal = saveBtn.innerHTML;
      const setLoading = (on)=>{ saveBtn.disabled = on; saveBtn.innerHTML = on ? 'Salvando...' : saveBtnOriginal; };

      saveBtn.addEventListener('click', async ()=>{
        const cliente = root.querySelector('#ncCliente').value.trim();
        const saida = root.querySelector('#ncSaida').value;
        const prazo = root.querySelector('#ncPrazo').value;
        if(!cliente){ toast('Informe o nome da cliente.', 'danger'); return; }
        if(!itens.length){ toast('Adicione ao menos uma peça.', 'danger'); return; }
        if(!saida || !prazo){ toast('Informe as datas de saída e prazo.', 'danger'); return; }
        if(prazo < saida){ toast('O prazo não pode ser antes da data de saída.', 'danger'); return; }

        setLoading(true);
        const telefone = root.querySelector('#ncTelefone').value.trim();
        const observacao = root.querySelector('#ncObs').value.trim();

        // Deduz estoque: a peça sai fisicamente da loja enquanto a condicional está aberta.
        itens.forEach(it=>{
          const prod = state.products.find(p=>p.id===it.productId);
          if(prod) prod.estoque = Math.max(0, prod.estoque - it.qtd);
        });

        const condicional = {
          id: uid('cond'), cliente, telefone, itens, saida, prazo,
          status:'em_aberto', observacao
        };
        state.condicionais.push(condicional);

        await Promise.all([persistCondicionais(), persistProducts()]);
        setLoading(false);
        closeModal();
        toast('Condicional registrada.', 'success');
        render();
      });
    }
  });
}

function openCondicionalDetalhe(c){
  if(!c) return;
  const efetivo = condicionalStatusEfetivo(c);
  const emAberto = efetivo==='em_aberto' || efetivo==='atrasado';

  const bodyHtml = `
    <div class="form-grid">
      <div class="field"><label>Cliente</label><input type="text" value="${escapeHtml(c.cliente)}" disabled></div>
      <div class="field"><label>Telefone</label><input type="text" value="${escapeHtml(c.telefone||'—')}" disabled></div>
      <div class="field"><label>Saída</label><input type="text" value="${dateBR(c.saida)}" disabled></div>
      <div class="field"><label>Prazo de devolução</label><input type="text" value="${dateBR(c.prazo)}" disabled></div>
    </div>
    <div style="margin-top:14px;">
      <label style="font-size:11.5px; color:var(--text-muted); font-weight:700;">Peças</label>
      <div class="cart-list" style="margin-top:8px;">
        ${(c.itens||[]).map(it=>`
          <div class="cart-item">
            <div>
              <div class="ci-name">${escapeHtml(it.nome)}</div>
              <div class="ci-meta">Tam. ${escapeHtml(it.tamanho)} · ${it.qtd}x</div>
            </div>
          </div>`).join('') || '<div style="font-size:12px; color:var(--text-faint);">Nenhuma peça registrada.</div>'}
      </div>
    </div>
    ${c.observacao ? `<p style="font-size:12.5px; color:var(--text-muted); margin-top:14px;"><b>Observação:</b> ${escapeHtml(c.observacao)}</p>` : ''}
    <p style="font-size:12.5px; margin-top:14px;"><b>Status atual:</b> ${condicionalStatusTag(efetivo)}</p>
  `;
  const footHtml = emAberto ? `
    <button class="btn btn-line" id="cdClose">Fechar</button>
    <button class="btn btn-ghost" id="cdVendido">Marcar como vendida</button>
    <button class="btn btn-gold" id="cdDevolvido">Marcar como devolvida</button>
  ` : `<button class="btn btn-line" id="cdClose">Fechar</button>`;

  openModal({
    title:'Detalhes da condicional', bodyHtml, footHtml,
    onMount:(root)=>{
      root.querySelector('#cdClose').addEventListener('click', closeModal);
      const btnDevolvido = root.querySelector('#cdDevolvido');
      if(btnDevolvido) btnDevolvido.addEventListener('click', async ()=>{
        (c.itens||[]).forEach(it=>{
          const prod = state.products.find(p=>p.id===it.productId);
          if(prod) prod.estoque += it.qtd;
        });
        c.status = 'devolvido';
        await Promise.all([persistCondicionais(), persistProducts()]);
        closeModal();
        toast('Condicional marcada como devolvida. Estoque atualizado.', 'success');
        render();
      });
      const btnVendido = root.querySelector('#cdVendido');
      if(btnVendido) btnVendido.addEventListener('click', async ()=>{
        c.status = 'vendido';
        await persistCondicionais();
        closeModal();
        toast('Condicional marcada como vendida. Registre a venda em Vendas, se ainda não feito.', 'success');
        render();
      });
    }
  });
}

            <div class="field span2"><label for="sNome">Nome da loja</label><input type="text" id="sNome" value="${escapeHtml(s.storeName)}"></div>
            <div class="field"><label for="sWhats">WhatsApp</label><input type="tel" id="sWhats" value="${escapeHtml(s.whatsapp)}" placeholder="(45) 99999-9999"></div>
            <div class="field"><label for="sInsta">Instagram</label><input type="text" id="sInsta" value="${escapeHtml(s.instagram)}" placeholder="@silvanamodacosmeticos"></div>
            <div class="field span2"><label for="sEnd">Endereço</label><input type="text" id="sEnd" value="${escapeHtml(s.address)}" placeholder="Rua, número, bairro, cidade"></div>
            <div class="field"><label for="sCnpj">CNPJ / CPF <span class="hint">opcional</span></label><input type="text" id="sCnpj" value="${escapeHtml(s.cnpj)}"></div>
          </div>
          <div style="margin-top:16px; display:flex; justify-content:flex-end;">
            <button class="btn btn-gold" id="btnSalvarLoja">Salvar dados da loja</button>
          </div>
        </div>

        <div class="panel">
          <div class="panel-head"><h3>Preferências de estoque</h3></div>
          <div class="switch-row">
            <div><div class="sl">Alertar estoque baixo</div><div class="sd">Mostra aviso no painel quando o estoque estiver no limite</div></div>
            <div class="switch ${s.lowStockAlert?'on':''}" id="toggleLowStock"></div>
          </div>
          <div class="field" style="max-width:220px; margin-top:12px;">
            <label for="sThreshold">Considerar estoque baixo quando for igual ou menor que</label>
            <input type="number" id="sThreshold" min="0" value="${s.lowStockThreshold}">
          </div>
          <div style="margin-top:14px; display:flex; justify-content:flex-end;">
            <button class="btn btn-ghost btn-sm" id="btnSalvarEstoque">Salvar preferências</button>
          </div>
        </div>
      </div>

      <!-- ── Coluna direita ── -->
      <div>
        <div class="panel">
          <div class="panel-head">
            <h3>Status da sincronização</h3>
          </div>
          <div class="conn-field">
            <span class="conn-dot ${supabaseOnline?'on':''}"></span>
            <span style="font-size:12px; color:var(--text-muted);">
              ${supabaseOnline
                ? 'Conectado — dados sincronizando em tempo real'
                : 'Sem conexão com o servidor — operando com dados locais'}
            </span>
          </div>
          <p style="font-size:11.5px; color:var(--text-faint); line-height:1.6; margin-top:12px; margin-bottom:0;">
            Produtos, vendas, clientes e configurações são salvos automaticamente. Um cache local garante que a loja continue funcionando mesmo sem internet.
          </p>
        </div>

        <!-- ── DADOS LOCAIS (inclui indicador de backup e botão) ── -->
        <div class="panel">
          <div class="panel-head"><h3>Dados locais</h3></div>

          <!-- Indicador "Último backup" + botão primário -->
          <div style="display:flex; align-items:center; justify-content:space-between; flex-wrap:wrap; gap:12px; padding:12px 0 14px 0; border-bottom:1px solid var(--border-soft); margin-bottom:14px;">
            <div>
              <div style="font-size:11px; text-transform:uppercase; letter-spacing:.07em; color:var(--text-faint); margin-bottom:4px;">Último backup</div>
              <div style="font-size:12.5px; color:var(--text-muted); font-weight:600;" id="lastBackupLabel">${lastBackupDate}</div>
            </div>
            <button class="btn btn-gold btn-sm" id="btnBackupNow">${ICON.download} Fazer backup agora</button>
          </div>

          <p style="font-size:12px; color:var(--text-faint); margin-top:0; margin-bottom:12px;">Faça backup dos dados cadastrados ou restaure uma versão anterior.</p>

          <div style="display:flex; gap:10px; flex-wrap:wrap;">
            <button class="btn btn-ghost btn-sm" id="btnExport">${ICON.download} Exportar backup</button>
            <label class="btn btn-ghost btn-sm" style="cursor:pointer;">
              ${ICON.upload} Importar backup
              <input type="file" id="btnImport" accept="application/json" style="display:none;">
            </label>
          </div>

          <div style="margin-top:16px; padding-top:14px; border-top:1px solid var(--border-soft);">
            <button class="btn btn-danger btn-sm" id="btnReset">${ICON.trash} Limpar todos os dados</button>
          </div>
        </div>

        <!-- ── BACKUP AUTOMÁTICO ── -->
        <div class="panel">
          <div class="panel-head"><h3>Backup automático</h3></div>

          <div class="switch-row">
            <div>
              <div class="sl">Salvar cópia no Supabase</div>
              <div class="sd">
                Cada backup também salva uma cópia JSON na tabela <strong style="color:var(--text-muted);">backups</strong> do seu projeto Supabase,
                acessível mesmo que o arquivo local seja perdido.
                Requer criação manual da tabela (ver comentário no código).
              </div>
            </div>
            <div class="switch ${s.supabaseBackup?'on':''}" id="toggleSupabaseBackup"></div>
          </div>

          <div class="field" style="max-width:240px; margin-top:16px;">
            <label for="sBackupInterval">Backup automático a cada (dias)</label>
            <input type="number" id="sBackupInterval" min="0" max="365" value="${s.backupIntervalDays!==undefined?s.backupIntervalDays:7}" placeholder="7">
            <div class="hint">Ao abrir o painel, se já passaram mais dias que o definido, o backup é disparado automaticamente. Use 0 para desativar.</div>
          </div>

          <div style="margin-top:14px; display:flex; justify-content:flex-end;">
            <button class="btn btn-ghost btn-sm" id="btnSalvarBackupConfig">Salvar preferências de backup</button>
          </div>
        </div>
      </div>
    </div>
  `;
}

function bindConfig(){
  /* ── Dados da loja ── */
  document.getElementById('btnSalvarLoja').addEventListener('click', ()=>{
    state.settings.storeName = document.getElementById('sNome').value.trim() || defaultSettings().storeName;
    state.settings.whatsapp = document.getElementById('sWhats').value.trim();
    state.settings.instagram = document.getElementById('sInsta').value.trim();
    state.settings.address = document.getElementById('sEnd').value.trim();
    state.settings.cnpj = document.getElementById('sCnpj').value.trim();
    persistSettings();
    document.querySelector('.brand-text .b1').textContent = state.settings.storeName.split(' ')[0] || 'Silvana';
    toast('Dados da loja salvos.', 'success');
  });

  /* ── Estoque ── */
  const toggleLS = document.getElementById('toggleLowStock');
  toggleLS.addEventListener('click', ()=>{
    state.settings.lowStockAlert = !state.settings.lowStockAlert;
    toggleLS.classList.toggle('on', state.settings.lowStockAlert);
  });
  document.getElementById('btnSalvarEstoque').addEventListener('click', ()=>{
    const t = parseInt(document.getElementById('sThreshold').value,10);
    state.settings.lowStockThreshold = isNaN(t) ? 3 : t;
    persistSettings();
    toast('Preferências de estoque salvas.', 'success');
  });

  /* ── "Fazer backup agora" (botão principal, dourado) ── */
  document.getElementById('btnBackupNow').addEventListener('click', ()=>exportBackup({isAuto:false}));

  /* ── "Exportar backup" (botão secundário — mesma ação, mantido por compatibilidade) ── */
  document.getElementById('btnExport').addEventListener('click', ()=>exportBackup({isAuto:false}));

  /* ── Importar backup ── */
  document.getElementById('btnImport').addEventListener('change', (e)=>{
    const file = e.target.files[0];
    if(!file) return;
    const reader = new FileReader();
    reader.onload = ()=>{
      try{
        const data = JSON.parse(reader.result);
        confirmModal('Importar este backup vai substituir os produtos, vendas e configurações atuais. Deseja continuar?', ()=>{
          if(Array.isArray(data.products)) state.products = data.products;
          if(Array.isArray(data.sales)) state.sales = data.sales;
          if(Array.isArray(data.condicionais)) state.condicionais = data.condicionais;
          if(data.settings) state.settings = {...defaultSettings(), ...data.settings, supabaseUrl:SUPABASE_URL, supabaseKey:SUPABASE_ANON_KEY};
          persistProducts(); persistSales(); persistCondicionais(); persistSettings();
          toast('Backup importado com sucesso.', 'success');
          render();
        });
      }catch(err){
        toast('Arquivo inválido. Verifique se é um backup exportado por este painel.', 'danger');
      }
    };
    reader.readAsText(file);
    e.target.value = '';
  });

  /* ── Limpar todos os dados ── */
  document.getElementById('btnReset').addEventListener('click', ()=>{
    confirmModal('Isso vai apagar <strong>todos</strong> os produtos, vendas e clientes — inclusive no Supabase — e recarregar os dados de exemplo. Esta ação não pode ser desfeita. Deseja continuar?', async ()=>{
      try{
        await db.saveProducts([]);
        await db.saveSales([]);
        await db.saveCondicionais([]);
      }catch(e){ /* já tratado internamente */ }
      localStorage.removeItem(STORAGE_KEYS.products);
      localStorage.removeItem(STORAGE_KEYS.sales);
      localStorage.removeItem(STORAGE_KEYS.condicionais);
      localStorage.removeItem(STORAGE_KEYS.settings);
      localStorage.removeItem(STORAGE_KEYS.seeded);
      await seedIfEmpty();
      await loadState();
      toast('Dados restaurados para o exemplo inicial.', 'success');
      render();
    });
  });

  /* ── Toggle: salvar backup no Supabase ── */
  const toggleSB = document.getElementById('toggleSupabaseBackup');
  toggleSB.addEventListener('click', ()=>{
    state.settings.supabaseBackup = !state.settings.supabaseBackup;
    toggleSB.classList.toggle('on', state.settings.supabaseBackup);
  });

  /* ── Salvar preferências de backup ── */
  document.getElementById('btnSalvarBackupConfig').addEventListener('click', ()=>{
    const interval = parseInt(document.getElementById('sBackupInterval').value, 10);
    state.settings.backupIntervalDays = isNaN(interval) || interval < 0 ? 7 : interval;
    persistSettings();
    toast('Preferências de backup salvas.', 'success');
  });
}

/* ============================================================
   INICIALIZAÇÃO
   ============================================================ */
(async function init(){
  await loadState();

  if(sb){
    try{
      const { data } = await sb.auth.getSession();
      if(data && data.session) await applyAuthSession(data.session);
    }catch(e){
      console.warn('[Auth] falha ao verificar sessão.', e.message||e);
    }
  }
  updateAdminSessionLabel();

  const boot = document.getElementById('bootLoading');
  if(boot) boot.remove();
  await showLoja();
})();

})();
</script>
