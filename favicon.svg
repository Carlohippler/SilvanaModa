<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1a1519"/>
      <stop offset="100%" stop-color="#0a0a0b"/>
    </linearGradient>
    <linearGradient id="ring" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#e7cf8f"/>
      <stop offset="100%" stop-color="#8a713a"/>
    </linearGradient>
    <linearGradient id="letter" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e7cf8f"/>
      <stop offset="100%" stop-color="#c9a24b"/>
    </linearGradient>
  </defs>

  <!-- Fundo circular -->
  <circle cx="32" cy="32" r="32" fill="url(#bg)"/>

  <!-- Anel dourado externo -->
  <circle cx="32" cy="32" r="29" fill="none" stroke="url(#ring)" stroke-width="1.2" opacity="0.8"/>

  <!-- Anel interno mais sutil -->
  <circle cx="32" cy="32" r="25" fill="none" stroke="#c9a24b" stroke-width="0.5" opacity="0.3"/>

  <!-- Letra S -->
  <text x="32" y="43"
        font-family="Georgia, 'Times New Roman', serif"
        font-size="34"
        font-style="italic"
        fill="url(#letter)"
        text-anchor="middle">S</text>
</svg>
